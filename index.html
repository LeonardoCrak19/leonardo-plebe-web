<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leonardo Plebe 🎮</title>
  <style>
    :root {
      --bg: #060b12;
      --bg-2: #0b1727;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-2: rgba(17, 24, 39, 0.96);
      --green: #20c55d;
      --green-2: #16a34a;
      --red: #ff2d55;
      --red-2: #ff4d6d;
      --blue: #1d4ed8;
      --line: rgba(255,255,255,0.08);
      --text: #f7fafc;
      --muted: #a3b1c6;
      --shadow: 0 18px 45px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(circle at top, rgba(32, 197, 93, 0.15), transparent 22%),
        linear-gradient(135deg, #04070b 0%, #071119 38%, #0c1726 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, input { font: inherit; }
    .hidden { display: none !important; }

    .screen {
      min-height: 100vh;
    }

    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
      gap: 24px;
      text-align: center;
    }

    .brand {
      font-size: clamp(2rem, 4vw, 3.3rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, #d9f99d 0%, #4ade80 20%, #22c55e 40%, #a3e635 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(34, 197, 94, 0.15);
    }

    .search-home {
      width: min(540px, 100%);
      padding: 16px 20px;
      border-radius: 18px;
      border: 1px solid rgba(96, 165, 250, 0.2);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: 0.2s ease;
    }

    .search-home:focus {
      border-color: rgba(34, 197, 94, 0.7);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12), inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .ad-box {
      width: min(430px, 100%);
      min-height: 100px;
      background: rgba(10, 14, 20, 0.7);
      border: 1px solid var(--line);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .entry-btn {
      padding: 16px 34px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: white;
      font-weight: 800;
      font-size: 1.05rem;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      box-shadow: 0 16px 26px rgba(34, 197, 94, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .entry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 32px rgba(34, 197, 94, 0.35);
    }

    .library {
      padding: 24px 18px 96px;
    }

    .library-top {
      max-width: 760px;
      margin: 0 auto 26px;
      text-align: center;
    }

    .library-title {
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 14px;
      color: #d7fbe1;
    }

    .search-library {
      width: min(560px, 100%);
      margin: 0 auto 18px;
      display: block;
      padding: 15px 18px;
      border-radius: 16px;
      border: 1px solid rgba(59, 130, 246, 0.22);
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .search-library:focus {
      border-color: rgba(34, 197, 94, 0.7);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.08);
    }

    .ad-inline {
      width: min(420px, 100%);
      min-height: 86px;
      margin: 0 auto 26px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(8, 12, 18, 0.7);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-grid {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 20px;
    }

    .game-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(11, 17, 25, 0.95));
      border: 1px solid rgba(255,255,255,0.07);
      border-left: 4px solid var(--red);
      border-radius: 22px;
      padding: 20px 16px 14px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
      text-align: center;
      min-height: 250px;
    }

    .game-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 77, 109, 0.62);
    }

    .game-cover {
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 18px;
      margin: 0 auto 14px;
      display: block;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .game-name {
      font-size: 1.08rem;
      font-weight: 800;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .downloads {
      color: var(--muted);
      font-size: 0.83rem;
      margin-bottom: 16px;
    }

    .download-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.95rem;
      transition: filter 0.2s ease;
    }

    .download-btn.locked {
      background: rgba(55, 65, 81, 0.8);
      color: #dfe7f4;
      cursor: not-allowed;
    }

    .download-btn.unlocked {
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: white;
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.24);
    }

    .download-btn.unlocked:hover {
      filter: brightness(1.04);
    }

    .pagination {
      max-width: 760px;
      margin: 26px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .pager-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .pager-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      min-width: 70px;
      text-align: center;
      font-weight: 800;
    }

    .creator-fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 50%;
      font-size: 2rem;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--red), var(--red-2));
      box-shadow: 0 18px 30px rgba(255, 45, 85, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
    }

    body.creator-mode .creator-fab { display: flex; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 18px;
    }

    .modal-box {
      width: min(440px, 100%);
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 24px 20px 18px;
      box-shadow: var(--shadow);
    }

    .modal-title {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #d0fdd7;
      font-weight: 800;
    }

    .field {
      width: 100%;
      display: block;
      margin-bottom: 14px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(17, 24, 39, 0.8);
      color: var(--text);
      outline: none;
    }

    .field:focus {
      border-color: rgba(34, 197, 94, 0.7);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .modal-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 800;
    }

    .modal-btn.cancel { background: rgba(75,85,99,0.9); color: white; }
    .modal-btn.save { background: linear-gradient(135deg, var(--green), var(--green-2)); color: white; }

    .ad-lock {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 10, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      z-index: 120;
      padding: 28px 20px;
    }

    .ad-lock p {
      color: #d6dce3;
      font-size: 1.2rem;
      margin-bottom: 18px;
    }

    .countdown {
      font-size: clamp(3.4rem, 12vw, 6rem);
      font-weight: 900;
      color: var(--red);
      margin-bottom: 20px;
      line-height: 1;
    }

    .unlock-btn {
      display: none;
      border: none;
      border-radius: 12px;
      padding: 14px 26px;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .unlock-btn.visible { display: inline-block; }

    .creator-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      border-radius: 14px;
      padding: 18px 24px;
      box-shadow: 0 20px 34px rgba(34, 197, 94, 0.3);
      z-index: 150;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @media (max-width: 700px) {
      .game-grid { grid-template-columns: 1fr; }
      .game-card { min-height: auto; }
    }
  </style>
</head>
<body>
  <div id="homeScreen" class="screen home">
    <h1 class="brand">Leonardo Plebe 🎮</h1>
    <input id="homeSearch" type="text" class="search-home" placeholder="Buscar juegos..." />

    <div class="ad-box">
      <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
      <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
    </div>

    <button id="enterLibrary" class="entry-btn">🎮 Ver Biblioteca</button>
  </div>

  <div id="libraryScreen" class="screen library hidden">
    <div class="library-top">
      <h2 class="library-title">Biblioteca de juegos</h2>
      <input id="librarySearch" type="text" class="search-library" placeholder="Buscar por nombre..." />
      <div class="ad-inline">
        <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
        <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
      </div>
    </div>

    <div id="gameGrid" class="game-grid"></div>

    <div class="pagination">
      <button id="prevPage" class="pager-btn">← Anterior</button>
      <span id="pageIndicator" class="page-indicator">1 / 1</span>
      <button id="nextPage" class="pager-btn">Siguiente →</button>
    </div>

    <button id="creatorFab" class="creator-fab" title="Agregar juego">+</button>
  </div>

  <div id="addModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3 class="modal-title">Publicar juego</h3>
      <input id="gameName" type="text" class="field" placeholder="Nombre del juego" />
      <input id="gameLink" type="text" class="field" placeholder="Enlace de descarga" />
      <input id="gameImage" type="file" class="field" accept="image/*" />
      <div class="modal-actions">
        <button id="cancelAdd" class="modal-btn cancel">Cancelar</button>
        <button id="saveGame" class="modal-btn save">✅ Publicar</button>
      </div>
    </div>
  </div>

  <div id="adLock" class="ad-lock hidden">
    <p>⏳ Espera 7 segundos para desbloquear la descarga</p>
    <div id="countdown" class="countdown">7</div>
    <button id="unlockBtn" class="unlock-btn">← Volver y Descargar</button>
  </div>

  <script>
    const CREATOR_CODE = '2k8L';
    const AD_URL = 'https://www.profitableratecpmnetwork.com/zg26qqbwk3?key=9a7994b8893e7a6cc73b4cfdc2f064e9';
    const PAGE_SIZE = 6;

    let games = [];
    let currentPage = 1;
    let searchText = '';
    let isCreator = false;
    let pendingGame = null;
    let unlockedThisSession = false;

    function saveGames() {
      localStorage.setItem('leonardo_plebe_games_v3', JSON.stringify(games));
    }

    function loadGames() {
      const saved = localStorage.getItem('leonardo_plebe_games_v3');
      if (saved) {
        games = JSON.parse(saved);
      } else {
        games = [{
          id: Date.now(),
          name: 'Minecraft',
          link: 'https://www.mediafire.com/file/vmaz5vp7pf0fu34/minecraft-26-45-music.apk/file?dky=vo0ai7eoxz6&=583',
          image: 'https://via.placeholder.com/88x88/20c55d/ffffff?text=MC',
          downloads: 0
        }];
        saveGames();
      }
    }

    function getFilteredGames() {
      return games.filter((g) => g.name.toLowerCase().includes(searchText.toLowerCase()));
    }

    function renderGames() {
      const grid = document.getElementById('gameGrid');
      const filtered = getFilteredGames();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageGames = filtered.slice(start, start + PAGE_SIZE);
      grid.innerHTML = '';

      pageGames.forEach((game) => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img class="game-cover" src="${game.image || 'https://via.placeholder.com/88x88/1f2937/ffffff?text=🎮'}" alt="${game.name}" />
          <div class="game-name">${game.name}</div>
          <div class="downloads">⬇️ ${game.downloads || 0} descargas</div>
          <button class="download-btn ${isCreator || unlockedThisSession ? 'unlocked' : 'locked'}" data-id="${game.id}">
            ${isCreator || unlockedThisSession ? '✅ Descargar' : '🔒 Ver Anuncio'}
          </button>
        `;
        grid.appendChild(card);
      });

      document.getElementById('pageIndicator').textContent = `${currentPage} / ${totalPages}`;
      document.getElementById('prevPage').disabled = currentPage <= 1;
      document.getElementById('nextPage').disabled = currentPage >= totalPages;

      document.querySelectorAll('.download-btn').forEach((button) => {
        button.addEventListener('click', handleDownload);
      });
    }

    function activateCreator() {
      if (isCreator) {
        alert('✅ Ya eres creador');
        return;
      }
      isCreator = true;
      document.body.classList.add('creator-mode');
      const toast = document.createElement('div');
      toast.className = 'creator-toast';
      toast.textContent = '✅ Bienvenido, Creador';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    function showLibrary() {
      document.getElementById('homeScreen').classList.add('hidden');
      document.getElementById('libraryScreen').classList.remove('hidden');
      renderGames();
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('gameName').value = '';
      document.getElementById('gameLink').value = '';
      document.getElementById('gameImage').value = '';
    }

    function handleDownload(event) {
      const id = Number(event.currentTarget.dataset.id);
      const game = games.find((item) => item.id === id);
      if (!game) return;

      if (isCreator || unlockedThisSession) {
        window.open(game.link, '_blank');
        game.downloads = (game.downloads || 0) + 1;
        saveGames();
        renderGames();
        return;
      }

      pendingGame = game;
      openAdLock();
    }

    function openAdLock() {
      document.getElementById('adLock').classList.remove('hidden');
      document.getElementById('unlockBtn').classList.remove('visible');
      const countdown = document.getElementById('countdown');
      countdown.textContent = '7';

      window.open(AD_URL, '_blank');

      let remaining = 7;
      const timer = setInterval(() => {
        remaining -= 1;
        countdown.textContent = String(remaining);
        if (remaining <= 0) {
          clearInterval(timer);
          countdown.textContent = '✅';
          document.getElementById('unlockBtn').classList.add('visible');
        }
      }, 1000);
    }

    function closeAdLock() {
      document.getElementById('adLock').classList.add('hidden');
      unlockedThisSession = true;
      if (pendingGame) {
        window.open(pendingGame.link, '_blank');
        pendingGame.downloads = (pendingGame.downloads || 0) + 1;
        saveGames();
        pendingGame = null;
      }
      renderGames();
    }

    function saveNewGame() {
      const name = document.getElementById('gameName').value.trim();
      const link = document.getElementById('gameLink').value.trim();
      const file = document.getElementById('gameImage').files[0];

      if (!name || !link) {
        alert('⚠️ Escribe nombre y enlace');
        return;
      }

      const finalize = (imageUrl) => {
        games.unshift({
          id: Date.now(),
          name,
          link,
          image: imageUrl,
          downloads: 0
        });
        saveGames();
        currentPage = 1;
        renderGames();
        closeAddModal();
        alert('✅ Juego publicado');
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 120;
            canvas.height = 120;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 120, 120);
            finalize(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        return;
      }

      finalize('https://via.placeholder.com/88x88/20c55d/ffffff?text=🎮');
    }

    document.getElementById('enterLibrary').addEventListener('click', showLibrary);

    document.getElementById('homeSearch').addEventListener('keypress', (event) => {
      if (event.key === 'Enter' && event.target.value.trim() === CREATOR_CODE) {
        activateCreator();
        event.target.value = '';
      }
    });

    document.getElementById('librarySearch').addEventListener('input', (event) => {
      searchText = event.target.value;
      currentPage = 1;
      renderGames();
    });

    document.getElementById('prevPage').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage -= 1;
        renderGames();
      }
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      const filtered = getFilteredGames();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage < totalPages) {
        currentPage += 1;
        renderGames();
      }
    });

    document.getElementById('creatorFab').addEventListener('click', openAddModal);
    document.getElementById('cancelAdd').addEventListener('click', closeAddModal);
    document.getElementById('saveGame').addEventListener('click', saveNewGame);
    document.getElementById('unlockBtn').addEventListener('click', closeAdLock);

    window.addEventListener('beforeunload', () => {
      unlockedThisSession = false;
      isCreator = false;
      document.body.classList.remove('creator-mode');
    });

    loadGames();
    renderGames();
  </script>
</body>
</html>
