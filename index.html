<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071119">
  <title>Leonardo Plebe 🎮</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050a10;
      --panel: #0d1725;
      --panel-soft: #111f2d;
      --green: #22c55e;
      --green2: #1d8d4b;
      --red: #ff2d55;
      --text: #f8fafc;
      --muted: #9caabe;
      --line: rgba(255,255,255,.12);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(34,197,94,.14), transparent 20%),
        linear-gradient(180deg, #050a10 0%, #0b1220 100%);
    }

    input, button {
      font: inherit;
    }

    .hidden { display: none !important; }

    .home,
    .library {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .brand {
      font-size: clamp(2.1rem, 5vw, 4rem);
      margin: 18px 0 10px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 22px;
      font-size: 1rem;
    }

    .search {
      width: min(100%, 520px);
      display: block;
      margin: 0 auto 18px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(15,23,42,.7);
      color: var(--text);
      outline: none;
    }

    .search::placeholder { color: var(--muted); }

    .ad-slot {
      max-width: 720px;
      margin: 0 auto 18px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.02);
      overflow: hidden;
    }

    .primary,
    .download-btn,
    .fab,
    .modal-btn {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .primary:hover,
    .download-btn:hover,
    .fab:hover,
    .modal-btn:hover {
      transform: translateY(-1px);
    }

    .primary {
      display: block;
      margin: 0 auto;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--green), var(--green2));
      color: #04110d;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title {
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      margin: 0;
    }

    .top .search {
      width: min(100%, 360px);
      margin: 0;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pager button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .pager button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, rgba(17,31,45,.95), rgba(15,18,28,.96));
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #101c2b;
      display: block;
    }

    .card-body {
      padding: 14px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      min-height: 48px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.84rem;
      margin-bottom: 12px;
    }

    .download-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, var(--green), var(--green2));
      color: #04110d;
      font-weight: 700;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green2));
      color: #04110d;
      font-size: 1.8rem;
      font-weight: 700;
      box-shadow: var(--shadow);
      z-index: 30;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.64);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 40;
    }

    .modal {
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .modal h3 {
      margin: 0 0 16px;
      font-size: 1.5rem;
    }

    .field {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      outline: none;
    }

    .field::placeholder { color: var(--muted); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .modal-btn {
      padding: 10px 16px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .modal-btn.primary-btn {
      background: linear-gradient(135deg, var(--green), var(--green2));
      color: #04110d;
      border: none;
      font-weight: 700;
    }

    .lock {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .lock-box {
      width: min(100%, 430px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .lock-box h2 {
      margin: 0 0 12px;
      font-size: 1.7rem;
    }

    .lock-box p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .count {
      display: inline-block;
      min-width: 54px;
      margin: 0 0 18px;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--green);
    }

    .unlock-btn {
      display: none;
      margin: 0 auto;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), var(--green2));
      color: #04110d;
      font-weight: 700;
      cursor: pointer;
    }

    .unlock-btn.show {
      display: block;
    }

    @media (max-width: 640px) {
      .top {
        display: block;
      }
      .top .search {
        margin-top: 12px;
      }
      .toolbar {
        display: block;
      }
      .pager {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main id="home" class="home">
    <h1 class="brand">Leonardo Plebe 🎮</h1>
    <p class="subtitle">Tus juegos favoritos en un solo lugar</p>
    <input id="homeSearch" class="search" type="search" placeholder="Buscar juegos...">

    <div class="ad-slot">
      <script async data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
      <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
    </div>

    <button id="enter" class="primary" type="button">🎮 Ver biblioteca</button>
  </main>

  <main id="library" class="library hidden">
    <section class="top">
      <h2 class="title">Biblioteca de juegos</h2>
      <input id="librarySearch" class="search" type="search" placeholder="Buscar por nombre...">
    </section>

    <div class="toolbar">
      <span id="totalGames">0 juegos</span>
      <div class="pager">
        <button id="prev" type="button">←</button>
        <span id="pageInfo">1/1</span>
        <button id="next" type="button">→</button>
      </div>
    </div>

    <div id="gamesGrid" class="games-grid"></div>
  </main>

  <div id="addModal" class="backdrop hidden">
    <div class="modal">
      <h3>Publicar juego 🎮</h3>
      <input id="name" class="field" type="text" placeholder="Nombre del juego">
      <input id="link" class="field" type="url" placeholder="Enlace del juego">
      <input id="image" class="field" type="file" accept="image/*">
      <div class="modal-actions">
        <button id="cancel" class="modal-btn" type="button">Cancelar</button>
        <button id="save" class="modal-btn primary-btn" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <div id="lock" class="lock hidden">
    <div class="lock-box">
      <h2>Desbloquear descarga</h2>
      <p>Abre el anuncio en otra pestaña y espera 7 segundos.</p>
      <div id="count" class="count">—</div>
      <button id="adOpen" class="primary" type="button">🌐 Abrir anuncio</button>
      <button id="unlock" class="unlock-btn" type="button">✅ Desbloquear</button>
    </div>
  </div>

  <button id="fab" class="fab" type="button" title="Añadir juego">+</button>

  <script>
    'use strict';

    const CREATOR_CODE = '2k8L';
    const PAGE_SIZE = 6;
    const STORAGE = 'leonardo_plebe_games_v4';
    const AD_URL = 'https://www.profitableratecpmnetwork.com/zg26qqbwk3?key=9a7994b8893e7a6cc73b4cfdc2f064e9';
    const FALLBACK = 'https://via.placeholder.com/300x180/0d1725/ffffff?text=Juego';
    const SUPABASE_URL = 'https://gpoxseorfxqifuoarupt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jsiB9GUjEQdb1RYCUokkIw_x-iYLEkw';

    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    let games = [];
    let currentPage = 1;
    let query = '';
    let creator = false;
    let pending = null;
    let unlocked = false;
    let timer = null;

    const $ = (id) => document.getElementById(id);

    function saveLocalStorage() {
      localStorage.setItem(STORAGE, JSON.stringify(games));
    }

    async function syncToSupabase() {
      if (!supabase) return;
      try {
        const rows = games.map((g) => ({
          id: Number(g.id),
          name: String(g.name || ''),
          link: String(g.link || ''),
          downloads: Number(g.downloads || 0),
          image_url: String(g.image_url || FALLBACK)
        }));

        const { error } = await supabase.from('games').upsert(rows, { onConflict: 'id' });
        if (error) console.error('Supabase sync error:', error);
      } catch (e) {
        console.error('Supabase sync failed:', e);
      }
    }

    async function loadFromSupabase() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase
          .from('games')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Supabase load error:', error);
          return;
        }

        if (!Array.isArray(data) || !data.length) return;

        games = data.map((g) => ({
          id: Number(g.id),
          name: g.name,
          link: g.link,
          downloads: Number(g.downloads || 0),
          image_url: g.image_url || FALLBACK
        }));

        saveLocalStorage();
      } catch (e) {
        console.error('Supabase load failed:', e);
      }
    }

    async function load() {
      try {
        const local = JSON.parse(localStorage.getItem(STORAGE) || '[]');
        games = Array.isArray(local) ? local : [];
      } catch (e) {
        games = [];
      }

      await loadFromSupabase();

      if (!games.length) {
        games = [{
          id: Date.now(),
          name: 'Minecraft',
          link: 'https://www.mediafire.com/file/4j4h8d9j5x2q0r8/Minecraft_Installer.zip/file',
          downloads: 0,
          image_url: FALLBACK
        }];
        saveLocalStorage();
        await syncToSupabase();
      }
    }

    function list() {
      const filtered = games.filter((g) =>
        String(g.name).toLowerCase().includes(query.toLowerCase())
      );
      return filtered;
    }

    function render() {
      const all = list();
      const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, pages);
      const part = all.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      const grid = $('gamesGrid');
      if (!grid) return;

      grid.innerHTML = part.map((game) => `
        <article class="card">
          <img class="thumb" src="${game.image_url || FALLBACK}" alt="${game.name}">
          <div class="card-body">
            <h3>${game.name}</h3>
            <div class="meta">
              <span>📥 ${game.downloads || 0}</span>
            </div>
            <button class="download-btn" data-id="${game.id}" type="button">Descargar</button>
          </div>
        </article>
      `).join('');

      $('totalGames').textContent = `${all.length} juegos`;
      $('pageInfo').textContent = `${currentPage}/${pages}`;
      $('prev').disabled = currentPage <= 1;
      $('next').disabled = currentPage >= pages;

      document.querySelectorAll('.download-btn').forEach((btn) => {
        btn.addEventListener('click', download);
      });
    }

    function showLibrary() {
      $('home').classList.add('hidden');
      $('library').classList.remove('hidden');
      render();
    }

    function activateCreator() {
      creator = true;
      document.body.classList.add('creator');
      render();
    }

    function download(e) {
      const game = games.find((g) => g.id === Number(e.currentTarget.dataset.id));
      if (!game) return;

      if (creator || unlocked) {
        openDownload(game);
        return;
      }

      pending = game;
      openLock();
    }

    function openDownload(game) {
      const win = window.open(game.link, '_blank');
      if (!win) {
        alert('Activa las ventanas emergentes para permitir la descarga.');
        return;
      }

      game.downloads = (game.downloads || 0) + 1;
      saveLocalStorage();
      syncToSupabase();
      render();
    }

    function openLock() {
      if (timer) clearInterval(timer);
      unlocked = false;
      $('lock').classList.remove('hidden');
      $('count').textContent = '—';
      $('unlock').classList.remove('show');
      $('count').textContent = '7';
    }

    $('enter').addEventListener('click', showLibrary);

    $('homeSearch').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim() === CREATOR_CODE) {
        activateCreator();
        e.target.value = '';
      }
    });

    $('librarySearch').addEventListener('input', (e) => {
      query = e.target.value;
      currentPage = 1;
      render();
    });

    $('librarySearch').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim() === CREATOR_CODE) {
        activateCreator();
        e.target.value = '';
      }
    });

    $('prev').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        render();
      }
    });

    $('next').addEventListener('click', () => {
      const maxPages = Math.max(1, Math.ceil(list().length / PAGE_SIZE));
      if (currentPage < maxPages) {
        currentPage++;
        render();
      }
    });

    $('adOpen').addEventListener('click', () => {
      window.open(AD_URL, '_blank');

      if (timer) clearInterval(timer);
      let n = 7;
      $('count').textContent = String(n);

      timer = setInterval(() => {
        n -= 1;
        $('count').textContent = String(n);

        if (n <= 0) {
          clearInterval(timer);
          timer = null;
          $('unlock').classList.add('show');
        }
      }, 1000);
    });

    $('unlock').addEventListener('click', () => {
      if (!pending) return;
      const game = pending;
      pending = null;
      $('lock').classList.add('hidden');
      unlocked = true;
      openDownload(game);
    });

    $('fab').addEventListener('click', () => {
      $('addModal').classList.remove('hidden');
    });

    $('cancel').addEventListener('click', () => {
      $('addModal').classList.add('hidden');
    });

    $('save').addEventListener('click', async () => {
      const name = $('name').value.trim();
      const link = $('link').value.trim();
      const file = $('image').files[0];

      if (!name || !/^https?:\/\//i.test(link)) {
        alert('Escribe un nombre y un enlace válido.');
        return;
      }

      const imageUrl = file ? URL.createObjectURL(file) : FALLBACK;
      const newGame = {
        id: Date.now(),
        name,
        link,
        downloads: 0,
        image_url: imageUrl
      };

      games.unshift(newGame);
      saveLocalStorage();
      await syncToSupabase();
      render();

      $('addModal').classList.add('hidden');
      $('name').value = '';
      $('link').value = '';
      $('image').value = '';
    });

    load().then(() => {
      render();
    });
  </script>
</body>
</html>
