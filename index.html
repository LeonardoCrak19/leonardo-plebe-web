<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071119">
  <title>Leonardo Plebe 🎮</title>
  <style>
    :root{
      --bg:#050a10;
      --card:#0f172a;
      --green:#22c55e;
      --green2:#15803d;
      --blue:#1e40af;
      --red:#ef4444;
      --text:#f8fafc;
      --muted:#94a3b8;
      --line:#ffffff15;
    }

    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      padding-bottom:70px;
    }
    button,input{font:inherit}
    button{cursor:pointer;border:0}
    input{outline:0;border:1px solid var(--line)}
    .hidden{display:none!important}

    /* === INICIO MÁS PEQUEÑO === */
    .home{
      max-width:420px;
      margin:0 auto;
      padding:40px 16px 30px;
      text-align:center;
    }
    .brand{font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:6px}
    .subtitle{color:var(--muted);margin-bottom:24px;font-size:14px}
    .search-bar{
      display:flex;
      gap:8px;
      margin-bottom:24px;
    }
    .search{
      flex:1;
      padding:12px 14px;
      border-radius:10px;
      background:var(--card);
      color:var(--text);
      border:1px solid var(--line);
      font-size:15px;
    }
    .btn-primary{
      padding:12px 16px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700;
      font-size:15px;
    }
    .ad-space{
      margin:0 auto 24px;
      padding:16px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#ffffff05;
    }
    .enter-btn{
      padding:14px 32px;
      font-size:16px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700;
    }

    /* === BIBLIOTECA MÁS COMPACTA === */
    .library{
      max-width:420px;
      margin:0 auto;
      padding:18px 12px;
    }
    .lib-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }
    .back-btn{
      background:transparent;
      color:var(--muted);
      font-size:15px;
      padding:6px 0;
    }
    .page-title{font-size:1.3rem}
    .game-count{color:var(--muted);font-size:13px}
    
    .lib-search{
      display:flex;
      gap:8px;
      margin-bottom:18px;
    }

    /* === TARJETAS CUADRADAS MÁS PEQUEÑAS === */
    .games-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .game-card{
      background:var(--card);
      border-radius:12px;
      overflow:hidden;
      border:1px solid transparent;
      transition:border-color .2s,transform .2s;
    }
    .game-card:hover{
      border-color:var(--green);
      transform:translateY(-2px);
    }
    .game-img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      background:#1e293b;
    }
    .game-info{
      padding:10px;
    }
    .game-name{
      font-size:14px;
      font-weight:700;
      margin-bottom:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .game-meta{
      font-size:11px;
      color:var(--muted);
      margin-bottom:8px;
    }
    .stars{
      color:#facc15;
      font-size:11px;
      margin-bottom:8px;
    }
    .btn-download{
      width:100%;
      padding:9px;
      border-radius:8px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700;
      font-size:13px;
    }
    .btn-locked{
      background:#334155;
      color:#94a3b8;
      cursor:not-allowed;
      background:none;
      border:1px solid #334155;
    }
    .creator-buttons{
      display:flex;
      gap:6px;
      margin-top:8px;
    }
    .btn-edit{
      flex:1;
      padding:8px;
      border-radius:8px;
      background:#1e40af;
      color:#fff;
      font-size:13px;
      font-weight:600;
    }
    .btn-delete{
      flex:1;
      padding:8px;
      border-radius:8px;
      background:#dc2626;
      color:#fff;
      font-size:13px;
      font-weight:600;
    }

    /* === PAGINACIÓN === */
    .pagination{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:16px;
      margin-top:24px;
    }
    .page-btn{
      padding:9px 14px;
      border-radius:8px;
      background:var(--card);
      color:var(--text);
      border:1px solid var(--line);
      font-size:14px;
    }
    .page-btn:disabled{opacity:.4;cursor:not-allowed}

    /* === BOTÓN AGREGAR === */
    .fab-add{
      position:fixed;
      bottom:90px;
      right:16px;
      width:52px;
      height:52px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-size:24px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 4px 12px #0005;
      z-index:90;
    }

    /* === BARRA DE NAVEGACIÓN INFERIOR === */
    .nav-bar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:var(--card);
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-around;
      padding:8px 0;
      z-index:80;
    }
    .nav-btn{
      background:transparent;
      color:var(--muted);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      font-size:11px;
    }
    .nav-btn.active{color:var(--green)}
    .nav-icon{font-size:20px}

    /* === MODAL === */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:#000e;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:200;
    }
    .modal{
      background:var(--card);
      border-radius:16px;
      padding:20px;
      max-width:380px;
      width:100%;
      border:1px solid var(--line);
    }
    .modal h3{margin-bottom:16px;text-align:center;font-size:1.25rem}
    .modal input{
      width:100%;
      padding:11px 13px;
      margin-bottom:10px;
      border-radius:9px;
      background:#0003;
      color:var(--text);
      border:1px solid var(--line);
      font-size:14px;
    }
    .modal-actions{
      display:flex;
      gap:10px;
      margin-top:10px;
    }
    .btn-cancel{
      flex:1;
      padding:11px;
      border-radius:9px;
      background:#334155;
      color:#fff;
      font-weight:600;
      font-size:14px;
    }
    .btn-save{
      flex:1;
      padding:11px;
      border-radius:9px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700;
      font-size:14px;
    }
    .img-preview{
      width:100%;
      border-radius:10px;
      margin:10px 0;
      display:none;
    }
    .img-preview.show{display:block}

    /* === BLOQUEO DE ANUNCIO === */
    .lock-modal{
      position:fixed;
      inset:0;
      background:#000e;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:300;
    }
    .lock-box{
      background:var(--card);
      border-radius:16px;
      padding:24px;
      max-width:340px;
      width:100%;
      text-align:center;
      border:1px solid var(--line);
    }
    .lock-box h2{font-size:1.25rem;margin-bottom:8px}
    .lock-box p{font-size:14px;color:var(--muted)}
    .lock-count{
      font-size:2.5rem;
      font-weight:700;
      color:var(--green);
      margin:16px 0;
    }
    .btn-ad{
      width:100%;
      padding:12px;
      border-radius:9px;
      background:linear-gradient(135deg,#f97316,#ea580c);
      color:#fff;
      font-weight:700;
      font-size:15px;
      margin-bottom:10px;
    }
    .btn-unlock{
      width:100%;
      padding:12px;
      border-radius:9px;
      background:var(--green);
      color:#000;
      font-weight:700;
      font-size:15px;
      display:none;
    }
    .btn-unlock.visible{display:block}
  </style>
</head>
<body>

  <!-- === PÁGINA DE INICIO === -->
  <div id="homePage" class="home">
    <h1 class="brand">Leonardo Plebe 🎮</h1>
    <p class="subtitle">Tus juegos favoritos aquí</p>
    
    <div class="search-bar">
      <input id="homeSearch" class="search" type="text" placeholder="Buscar juegos...">
      <button id="homeSearchBtn" class="btn-primary">Buscar</button>
    </div>

    <div class="ad-space">
      <script async data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
      <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
    </div>

    <button id="enterBtn" class="enter-btn">🎮 Ver Biblioteca</button>
  </div>

  <!-- === BIBLIOTECA === -->
  <div id="libraryPage" class="library hidden">
    <div class="lib-header">
      <button id="backHome" class="back-btn">← Inicio</button>
      <h2 class="page-title">Juegos</h2>
      <span id="gameCount" class="game-count">0</span>
    </div>

    <div class="lib-search">
      <input id="libSearch" class="search" type="text" placeholder="Buscar...">
      <button id="libSearchBtn" class="btn-primary">🔍</button>
    </div>

    <div id="gamesGrid" class="games-grid"></div>

    <div class="pagination">
      <button id="prevPage" class="page-btn">←</button>
      <span id="pageInfo">1/1</span>
      <button id="nextPage" class="page-btn">→</button>
    </div>
  </div>

  <!-- === BOTÓN AGREGAR === -->
  <button id="fabAdd" class="fab-add hidden">+</button>

  <!-- === BARRA DE NAVEGACIÓN === -->
  <nav id="navBar" class="nav-bar hidden">
    <button class="nav-btn active" data-view="games">
      <span class="nav-icon">🎮</span>
      Juegos
    </button>
    <button class="nav-btn" data-view="apps">
      <span class="nav-icon">📱</span>
      Apps
    </button>
    <button class="nav-btn" data-view="popular">
      <span class="nav-icon">🔥</span>
      Popular
    </button>
    <button class="nav-btn" data-view="skins">
      <span class="nav-icon">🎨</span>
      Skins
    </button>
  </nav>

  <!-- === MODAL AGREGAR/EDITAR === -->
  <div id="gameModal" class="modal-backdrop hidden">
    <div class="modal">
      <h3 id="modalTitle">Agregar Juego 🎮</h3>
      <input id="gameName" type="text" placeholder="Nombre del juego">
      <input id="gameLink" type="url" placeholder="Enlace de descarga">
      <input id="gameImageUrl" type="url" placeholder="🔗 Enlace de imagen (Imgur)">
      <input id="gameImageFile" type="file" accept="image/*" placeholder="O sube desde galería">
      <img id="imgPreview" class="img-preview" alt="Vista previa">
      <div class="modal-actions">
        <button id="modalCancel" class="btn-cancel">Cancelar</button>
        <button id="modalSave" class="btn-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- === BLOQUEO DE ANUNCIO === -->
  <div id="lockModal" class="lock-modal hidden">
    <div class="lock-box">
      <h2>🔒 Desbloquear Descarga</h2>
      <p>Ve el anuncio para obtener el enlace</p>
      <div id="lockCount" class="lock-count">7</div>
      <button id="goAdBtn" class="btn-ad">🌐 Abrir Anuncio</button>
      <button id="unlockBtn" class="btn-unlock">✅ Ya lo vi — Descargar</button>
    </div>
  </div>

<script>
'use strict';

const CREATOR_CODE = '2k8L';
const PAGE_SIZE = 8;
const AD_URL = 'https://www.profitableratecpmnetwork.com/zg26qqbwk3?key=9a7994b8893e7a6cc73b4cfdc2f064e9';
const FALLBACK_IMG = 'https://via.placeholder.com/300/0f172a/f8fafc?text=🎮';

let games = [];
let currentPage = 1;
let searchQuery = '';
let isCreator = false;
let pendingGame = null;
let isUnlocked = false;
let countdownTimer = null;
let editingId = null;

const $ = id => document.getElementById(id);

// === JUEGOS INICIALES ===
const DEFAULT_GAMES = [
  {
    id: 1789934945734,
    name: "Minecraft",
    link: "https://www.mediafire.com/file/cim5n289rfeguzn/mc%201.26.45.1%20-%20espacioapk.com.apk/file?dkey=l5wy06u4df0&r=577",
    image: "https://i.imgur.com/I4f3CVY.jpg",
    downloads: 3,
    version: "1.26.45.1",
    date: "26 sep 2026"
  },
  {
    id: 1789935000001,
    name: "Bulma Adventure 3",
    link: "https://www.mediafire.com/file/tjoxvvu7hg7g0j6/Bulma%20Adventure%203%20v1.0%20-%20espacioapk.com.apk/file?dkey=ek6a12ukl68&r=1259",
    image: "https://i.imgur.com/vHLKb6n.jpg",
    downloads: 0,
    version: "v1.0",
    date: "26 sep 2026"
  },
  {
    id: 1789935000002,
    name: "Bulma Adventure",
    link: "https://espacioapk.co/apk/Bulma%20Adventure%201%20v1.00%20-%20espacioapk.com.apk",
    image: "https://i.imgur.com/3QMpOBC.jpg",
    downloads: 0,
    version: "v1.00",
    date: "26 sep 2026"
  },
  {
    id: 1789935000003,
    name: "Five Nights in Anime RX",
    link: "https://download2391.mediafire.com/7ozvcnr8dkwgaejggLepLRuFXKM7UhReZSwIJNYVWTHU3dofbyYp8DkQueNnljEJvsgpqFUjHVM388TVfyYnSfPx4cIUBEwEddxavDtmyJfW0VLqMWSCmpkugM1cXGWaZMaPEvWOmBMccZMYhW7q6TD30zWeGp5H8vCRS-xQEdHI0g/xss34jppa8wufgt/FNIA+RX+v1.5+-+espacioapk.com.apk",
    image: "https://i.imgur.com/pl7HGVi.jpg",
    downloads: 0,
    version: "v1.5",
    date: "26 sep 2026"
  },
  {
    id: 1789935000004,
    name: "Ho My Waifu",
    link: "https://www.mediafire.com/file/h22r0k79uxaldic/OMW+(1).apk/file",
    image: "https://i.imgur.com/IuHm7vE.jpg",
    downloads: 0,
    version: "1.0",
    date: "26 sep 2026"
  }
];

// === GUARDADO ===
function saveGames() {
  localStorage.setItem('leonardoGames', JSON.stringify(games));
}

function loadGames() {
  const stored = localStorage.getItem('leonardoGames');
  if (stored) {
    try { games = JSON.parse(stored); }
    catch { games = [...DEFAULT_GAMES]; }
  } else {
    games = [...DEFAULT_GAMES];
  }
  renderGames();
}

// === FILTROS ===
function getFilteredGames() {
  if (!searchQuery) return games;
  const q = searchQuery.toLowerCase();
  return games.filter(g => g.name.toLowerCase().includes(q));
}

// === ESTRELLITAS ===
function renderStars(rating = 4) {
  let s = '';
  for (let i=0; i<5; i++) s += i < rating ? '★' : '☆';
  return s;
}

// === RENDERIZADO PRINCIPAL ===
function renderGames() {
  const filtered = getFilteredGames();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageGames = filtered.slice(start, start + PAGE_SIZE);
  const grid = $('gamesGrid');

  if (pageGames.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">No hay juegos</p>';
  } else {
    grid.innerHTML = pageGames.map(game => `
      <div class="game-card">
        <img class="game-img" src="${game.image || FALLBACK_IMG}" alt="${game.name}" onerror="this.src='${FALLBACK_IMG}'">
        <div class="game-info">
          <h3 class="game-name">${game.name}</h3>
          <p class="game-meta">${game.version || ''}<br>${game.date || ''}</p>
          <div class="stars">${renderStars()}</div>
          <button class="btn-download ${(!isCreator && !isUnlocked) ? 'btn-locked' : ''}" data-id="${game.id}">
            ${(!isCreator && !isUnlocked) ? '🔒 Ver Anuncio' : '✅ Descargar'}
          </button>
          ${isCreator ? `
            <div class="creator-buttons">
              <button class="btn-edit" data-edit="${game.id}">✏️</button>
              <button class="btn-delete" data-del="${game.id}">🗑️</button>
            </div>
          ` : ''}
        </div>
      </div>
    `).join('');
  }

  $('gameCount').textContent = `${filtered.length}`;
  $('pageInfo').textContent = `${currentPage}/${totalPages}`;
  $('prevPage').disabled = currentPage <= 1;
  $('nextPage').disabled = currentPage >= totalPages;
}

// === NAVEGACIÓN ===
function showHome() {
  $('homePage').classList.remove('hidden');
  $('libraryPage').classList.add('hidden');
  $('navBar').classList.add('hidden');
  $('fabAdd').classList.add('hidden');
  searchQuery = '';
  $('homeSearch').value = '';
}

function showLibrary() {
  $('homePage').classList.add('hidden');
  $('libraryPage').classList.remove('hidden');
  $('navBar').classList.remove('hidden');
  $('fabAdd').classList.toggle('hidden', !isCreator);
  currentPage = 1;
  renderGames();
}

// === ANUNCIO ===
function openLockModal(game) {
  pendingGame = game;
  isUnlocked = false;
  $('unlockBtn').classList.remove('visible');
  $('lockCount').textContent = '7';
  $('lockModal').classList.remove('hidden');
  
  if (countdownTimer) clearInterval(countdownTimer);
  let sec = 7;
  countdownTimer = setInterval(() => {
    sec--;
    $('lockCount').textContent = sec;
    if (sec <= 0) {
      clearInterval(countdownTimer);
      $('unlockBtn').classList.add('visible');
    }
  }, 1000);
}

function doDownload(game) {
  game.downloads = (game.downloads || 0) + 1;
  saveGames();
  window.open(game.link, '_blank');
  renderGames();
}

// === MODAL ===
function openAddModal() {
  editingId = null;
  $('modalTitle').textContent = 'Agregar Juego 🎮';
  $('gameName').value = '';
  $('gameLink').value = '';
  $('gameImageUrl').value = '';
  $('gameImageFile').value = '';
  $('imgPreview').src = '';
  $('imgPreview').classList.remove('show');
  $('gameModal').classList.remove('hidden');
}

function openEditModal(game) {
  editingId = game.id;
  $('modalTitle').textContent = 'Editar Juego ✏️';
  $('gameName').value = game.name;
  $('gameLink').value = game.link;
  $('gameImageUrl').value = '';
  $('gameImageFile').value = '';
  $('imgPreview').src = game.image || FALLBACK_IMG;
  $('imgPreview').classList.add('show');
  $('gameModal').classList.remove('hidden');
}

function closeModal() {
  $('gameModal').classList.add('hidden');
  editingId = null;
}

async function saveGameData() {
  const name = $('gameName').value.trim();
  const link = $('gameLink').value.trim();
  const imgUrl = $('gameImageUrl').value.trim();
  const imgFile = $('gameImageFile').files[0];

  if (!name || !link) {
    alert('⚠️ Nombre y enlace son obligatorios');
    return;
  }

  let image = FALLBACK_IMG;
  if (imgUrl && imgUrl.startsWith('http')) {
    image = imgUrl;
  } else if (imgFile) {
    image = await new Promise(res => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(imgFile);
    });
  }

  const today = new Date().toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'});

  if (editingId) {
    const idx = games.findIndex(g => g.id === editingId);
    if (idx !== -1) {
      games[idx] = { ...games[idx], name, link, image };
    }
  } else {
    games.unshift({
      id: Date.now(),
      name,
      link,
      image,
      downloads: 0,
      version: "1.0",
      date: today
    });
  }

  saveGames();
  closeModal();
  renderGames();
}

function deleteGame(id) {
  if (!confirm('¿Eliminar? No se puede deshacer.')) return;
  games = games.filter(g => g.id !== id);
  saveGames();
  renderGames();
}

// === CÓDIGO CREADOR ===
function checkCreatorCode(input) {
  if (input.trim() === CREATOR_CODE) {
    isCreator = true;
    alert('✅ ¡Bienvenido Creador!');
    showLibrary();
    return true;
  }
  return false;
}

// === EVENTOS ===
$('enterBtn').addEventListener('click', showLibrary);
$('backHome').addEventListener('click', showHome);

$('homeSearchBtn').addEventListener('click', () => {
  const val = $('homeSearch').value.trim();
  if (checkCreatorCode(val)) return;
  searchQuery = val;
  showLibrary();
});
$('homeSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = $('homeSearch').value.trim();
    if (checkCreatorCode(val)) return;
    searchQuery = val;
    showLibrary();
  }
});

$('libSearchBtn').addEventListener('click', () => {
  searchQuery = $('libSearch').value.trim();
  currentPage = 1;
  renderGames();
});
$('libSearch').addEventListener('input', () => {
  searchQuery = $('libSearch').value.trim();
  currentPage = 1;
  renderGames();
});

$('prevPage').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderGames(); } });
$('nextPage').addEventListener('click', () => { currentPage++; renderGames(); });

$('fabAdd').addEventListener('click', openAddModal);
$('modalCancel').addEventListener('click', closeModal);
$('modalSave').addEventListener('click', saveGameData);

$('gameImageFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    $('imgPreview').src = ev.target.result;
    $('imgPreview').classList.add('show');
  };
  r.readAsDataURL(f);
});

// Acciones en tarjetas
document.addEventListener('click', e => {
  const dl = e.target.closest('.btn-download');
  if (dl) {
    const id = parseInt(dl.dataset.id);
    const game = games.find(g => g.id === id);
    if (!game) return;
    if (isCreator || isUnlocked) {
      doDownload(game);
    } else {
      openLockModal(game);
    }
  }

  const ed = e.target.closest('[data-edit]');
  if (ed) {
    const id = parseInt(ed.dataset.edit);
    const game = games.find(g => g.id === id);
    if (game) openEditModal(game);
  }

  const de = e.target.closest('[data-del]');
  if (de) {
    const id = parseInt(de.dataset.del);
    deleteGame(id);
  }
});

// Anuncio
$('goAdBtn').addEventListener('click', () => {
  window.open(AD_URL, '_blank');
});
$('unlockBtn').addEventListener('click', () => {
  isUnlocked = true;
  $('lockModal').classList.add('hidden');
  if (pendingGame) doDownload(pendingGame);
  renderGames();
});

// Iniciar
loadGames();
</script>
</body>
</html>
