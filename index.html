<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonardo Plebe 🎮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 🎮 CONTENIDO PRINCIPAL — LIBRE, SIN ANUNCIOS ENCIMA */
        .contenido { 
            flex: 1;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 40px 20px; 
            text-align: center;
        }
        .logo { font-size: 70px; margin-bottom: 15px; }
        h1 { color: #2ecc71; font-size: 42px; margin-bottom: 10px; }
        .subtitulo { color: #ccc; font-size: 18px; margin-bottom: 50px; }
        
        /* ✅ BOTÓN — TOTALMENTE LIBRE */
        .btn { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 20px 40px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 16px; 
            cursor: pointer; 
            width: 85%; 
            max-width: 340px; 
            transition: transform 0.2s;
            position: relative;
            z-index: 1;
        }
        .btn:hover { transform: scale(1.05); }

        /* 📢 SOLO 1 ANUNCIO — ABAJO, TAMAÑO MEDIANO, SIN ESTORBAR */
        .anuncio-unico {
            width: 90%;
            max-width: 400px;
            margin: 0 auto 30px auto;
            padding: 10px;
            text-align: center;
            border-top: 2px solid #2ecc71;
            border-bottom: 2px solid #2ecc71;
            min-height: 280px; /* Tamaño como la foto que viste */
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 🎮 PARTE DE ARRIBA — TOTALMENTE LIMPIA -->
    <div class="contenido">
        <div class="logo">🎮</div>
        <h1>Leonardo Plebe</h1>
        <p class="subtitulo">Los mejores juegos — descarga gratis</p>
        
        <!-- ✅ BOTÓN — NADA LO TAPA, SE PULSA BIEN -->
        <button class="btn" onclick="alert('Próximamente! 🚀')">📚 Biblioteca de Juegos</button>
    </div>

    <!-- 📢 SOLO 1 ANUNCIO — ABAJO, TAMAÑO MEDIANO, LEJOS DEL BOTÓN -->
    <div class="anuncio-unico">
        <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
        <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
    </div>

</body>
</html>
