<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Favorite Games Here</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        :root{--red:#ff0033;--green:#2ecc71;--blue:#1a1a2e;--black:#000;--dark:#111}
        body{background:var(--black);color:#fff;min-height:100vh}
        .hidden{display:none!important}

        .home{padding:50px 20px;text-align:center;min-height:100vh;display:flex;flex-direction:column}
        .main-area{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px}
        .logo{font-size:70px}
        h1{color:var(--green);font-size:26px}
        .subtitle{color:#888;font-size:16px}
        .btn-enter{background:#fff;color:#000;border:none;padding:16px 36px;font-size:18px;font-weight:bold;border-radius:12px;cursor:pointer;transition:transform .2s}
        .btn-enter:hover{transform:scale(1.05)}
        .ads-area{padding:15px;border-top:1px solid #222;margin-top:auto}
        .ad-unit{max-width:400px;margin:0 auto;min-height:100px}

        .header{padding:15px;border-bottom:1px solid #222;background:rgba(0,0,0,.95);position:sticky;top:0;z-index:50}
        .search-bar{width:100%;padding:12px 16px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:15px;text-align:center}
        .search-bar::placeholder{color:#666}
        .creator-badge{text-align:center;color:var(--green);padding:10px;display:none}
        .games-grid{padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px;max-width:500px;margin:0 auto}
        .game-card{background:var(--dark);border-radius:12px;padding:15px;text-align:center;border-left:3px solid var(--red)}
        .game-img{width:60px;height:60px;border-radius:8px;object-fit:cover;margin-bottom:10px;background:#222}
        .game-name{font-weight:bold;margin-bottom:5px;font-size:14px}
        .game-dls{font-size:11px;color:#888;margin-bottom:10px}
        .btn-dl{background:#444;color:#999;border:none;padding:10px;border-radius:8px;width:100%;font-weight:bold;cursor:not-allowed;transition:all .3s}
        .btn-dl.unlocked{background:var(--green);color:#000;cursor:pointer}
        .add-btn{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--green);color:#000;border:none;font-size:30px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(46,204,113,.3);display:none}

        .ad-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999}
        .modal-content{text-align:center;padding:30px;max-width:400px}
        .modal-title{font-size:22px;margin-bottom:15px;color:var(--green)}
        .timer{font-size:48px;font-weight:bold;margin:20px 0;color:var(--red)}
        .btn-go-ad{background:var(--red);color:#fff;border:none;padding:15px 30px;font-size:18px;font-weight:bold;border-radius:10px;cursor:pointer;margin-bottom:15px}
        .btn-back{background:var(--green);color:#000;border:none;padding:12px 25px;font-size:16px;font-weight:bold;border-radius:10px;cursor:pointer;display:none}

        .form-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px}
        .form-box{background:var(--dark);padding:25px;border-radius:12px;width:100%;max-width:350px}
        .form-title{text-align:center;margin-bottom:20px;color:var(--green)}
        .form-input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:none;background:#222;color:#fff;font-size:14px}
        .form-buttons{display:flex;gap:10px;margin-top:10px}
        .btn-save{flex:1;background:var(--green);color:#000;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
        .btn-cancel{flex:1;background:#444;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
        .optimizing{color:#ffcc00;padding:8px;text-align:center;font-size:13px;display:none}
    </style>
</head>
<body>

<!-- HOME -->
<div id="page-home" class="home">
    <div class="main-area">
        <div class="logo">🎮</div>
        <h1>Your Favorite Games Here</h1>
        <p class="subtitle">Free downloads — all the best games</p>
        <button class="btn-enter" onclick="openLibrary()">📚 Game Library</button>
    </div>
    <div class="ads-area">
        <div class="ad-unit">
            <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
            <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
        </div>
    </div>
</div>

<!-- LIBRARY -->
<div id="page-library" class="hidden">
    <div class="header">
        <input type="text" class="search-bar" id="search-input" placeholder="Search games, apps, and more..." oninput="filterGames(this.value)">
        <div class="creator-badge" id="creator-msg">✅ Welcome, Creator 🔥</div>
    </div>
    <div class="games-grid" id="games-container"></div>
    <button class="add-btn" id="add-game-btn" onclick="openForm()">+</button>
</div>

<!-- AD MODAL -->
<div id="ad-popup" class="ad-modal hidden">
    <div class="modal-content">
        <p class="modal-title">🔓 Unlock Download</p>
        <p>Watch the ad to download for free</p>
        <div class="timer" id="countdown">7</div>
        <button class="btn-go-ad" id="go-ad-btn" onclick="openAdTab()">🌐 Watch Ad</button>
        <button class="btn-back" id="back-btn" onclick="closeAdModal()">← I've seen it, Download</button>
    </div>
</div>

<!-- ADD GAME FORM -->
<div id="form-popup" class="form-modal hidden">
    <div class="form-box">
        <h3 class="form-title">➕ Add New Game</h3>
        <input type="text" class="form-input" id="game-name" placeholder="Game Name">
        <input type="text" class="form-input" id="game-link" placeholder="Download Link">
        <input type="file" class="form-input" id="game-icon" accept="image/*" onchange="optimizeImage(this)">
        <div class="optimizing" id="opt-text">⚙️ Optimizing image... ⏳</div>
        <input type="hidden" id="optimized-img">
        <div class="form-buttons">
            <button class="btn-cancel" onclick="closeForm()">Cancel</button>
            <button class="btn-save" onclick="saveGame()">Save Game</button>
        </div>
    </div>
</div>

<script>
const CREATOR_CODE = "2k8L";
const AD_LINK = "https://pl31361169.profitableratecpmnetwork.com/22/e5/ce/22e5ce45b7f08d83a957b7a61350ecf6.js";

let games = JSON.parse(localStorage.getItem('games') || '[]');

// Default Minecraft game
if(games.length === 0){
    games = [{
        id: Date.now(),
        name: "Minecraft",
        link: "https://www.mediafire.com/file/vmaz5vp7pf0fu34/minecraft-26-45-music.apk/file?dky=vo0ai7eoxz6&=583",
        image: "",
        downloads: 0,
        unlocked: false
    }];
    saveGames();
}

let isCreator = false, currentGame = null;

// Creator code check
document.getElementById('search-input').addEventListener('keypress', e => {
    if(e.key === 'Enter' && e.target.value.trim() === CREATOR_CODE){
        isCreator = true;
        document.getElementById('add-game-btn').style.display = 'block';
        document.getElementById('creator-msg').style.display = 'block';
        e.target.value = '';
    }
});

function openLibrary(){
    document.getElementById('page-home').classList.add('hidden');
    document.getElementById('page-library').classList.remove('hidden');
    renderGames();
}

function renderGames(list = games){
    const container = document.getElementById('games-container');
    container.innerHTML = '';
    list.forEach(game => {
        const imgSrc = game.image || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23222" width="100" height="100"/><text x="50" y="60" text-anchor="middle" fill="%23888" font-size="40">🎮</text></svg>';
        container.innerHTML += `
        <div class="game-card">
            <img src="${imgSrc}" class="game-img" alt="${game.name}">
            <div class="game-name">${game.name}</div>
            <div class="game-dls">🔥 ${game.downloads} downloads</div>
            <button class="btn-dl ${game.unlocked || isCreator ? 'unlocked' : ''}" 
                    onclick="startDownload(${game.id})">
                ${game.unlocked || isCreator ? '⬇️ Download' : '🔒 Unlock First'}
            </button>
        </div>`;
    });
}

function filterGames(text){
    const search = text.toLowerCase();
    renderGames(games.filter(g => g.name.toLowerCase().includes(search)));
}

function startDownload(id){
    currentGame = games.find(g => g.id === id);
    if(!currentGame) return;
    
    if(currentGame.unlocked || isCreator){
        doDownload();
        return;
    }
    
    // Show ad modal with countdown
    document.getElementById('ad-popup').classList.remove('hidden');
    let timeLeft = 7;
    document.getElementById('countdown').textContent = timeLeft;
    document.getElementById('go-ad-btn').style.display = 'inline-block';
    document.getElementById('back-btn').style.display = 'none';
    
    const timer = setInterval(() => {
        timeLeft--;
        document.getElementById('countdown').textContent = timeLeft;
        if(timeLeft <= 0){
            clearInterval(timer);
            document.getElementById('go-ad-btn').style.display = 'none';
            document.getElementById('back-btn').style.display = 'inline-block';
        }
    }, 1000);
}

function openAdTab(){
    window.open(AD_LINK, '_blank');
}

function closeAdModal(){
    if(currentGame){
        currentGame.unlocked = true;
        saveGames();
        renderGames();
    }
    document.getElementById('ad-popup').classList.add('hidden');
}

function doDownload(){
    if(!currentGame) return;
    currentGame.downloads++;
    saveGames();
    renderGames();
    window.open(currentGame.link, '_blank');
}

function saveGames(){
    localStorage.setItem('games', JSON.stringify(games));
}

// Auto image optimizer
function optimizeImage(input){
    const file = input.files[0];
    if(!file) return;
    document.getElementById('opt-text').style.display = 'block';
    
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const maxSize = 128;
            let w = img.width, h = img.height;
            if(w > h && w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; }
            else if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; }
            
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            
            document.getElementById('optimized-img').value = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('opt-text').style.display = 'none';
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function openForm(){
    document.getElementById('form-popup').classList.remove('hidden');
    document.getElementById('game-name').value = '';
    document.getElementById('game-link').value = '';
    document.getElementById('optimized-img').value = '';
}

function closeForm(){
    document.getElementById('form-popup').classList.add('hidden');
}

function saveGame(){
    const name = document.getElementById('game-name').value.trim();
    const link = document.getElementById('game-link').value.trim();
    const img = document.getElementById('optimized-img').value;
    
    if(!name || !link) return alert('Fill in name and link ✅');
    
    games.push({
        id: Date.now(),
        name: name,
        link: link,
        image: img,
        downloads: 0,
        unlocked: false
    });
    
    saveGames();
    closeForm();
    renderGames();
}
</script>
</body>
</html>
