<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonardo Plebe 🎮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        :root {
            --negro: #050505;
            --fondo-tarjeta: #0f1729;
            --verde: #15803d;
            --verde-claro: #22c55e;
            --rojo-acento: #ff0033;
            --azul-busqueda: #0f1729;
            --borde-azul: #1e3a8a;
            --texto: #ffffff;
            --texto-sutil: #9ca3af;
            --sombra: 0 4px 20px rgba(0,0,0,0.6);
            --sombra-verde: 0 0 15px rgba(34, 197, 94, 0.25);
        }
        body { background: linear-gradient(145deg, #000000, #0f1729); color: var(--texto); min-height: 100vh; }
        .oculto { display: none !important; }
        .inicio { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; }
        .logo-titulo { font-size: 34px; font-weight: 800; margin-bottom: 45px; text-align: center; background: linear-gradient(90deg, #22c55e, #15803d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .buscador-inicio { width: 100%; max-width: 460px; padding: 15px 22px; margin-bottom: 25px; background: var(--azul-busqueda); border: 2px solid var(--borde-azul); border-radius: 14px; color: var(--texto); font-size: 16px; outline: none; transition: 0.3s ease; }
        .buscador-inicio:focus { border-color: var(--verde-claro); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
        .anuncio-fila { width: 100%; max-width: 420px; min-height: 90px; margin-bottom: 35px; background: var(--fondo-tarjeta); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #1f2937; padding: 8px; }
        .btn-entrar { background: linear-gradient(135deg, #15803d, #22c55e); border: none; color: white; padding: 16px 45px; font-size: 18px; font-weight: bold; border-radius: 14px; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease; box-shadow: var(--sombra-verde); }
        .btn-entrar:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(34, 197, 94, 0.35); }
        .biblioteca { min-height: 100vh; padding: 25px 18px 100px; }
        .cabecera { text-align: center; margin-bottom: 30px; }
        .titulo-bib { font-size: 26px; font-weight: bold; margin-bottom: 15px; color: var(--verde-claro); }
        .buscador-bib { width: 100%; max-width: 480px; padding: 14px 20px; margin-bottom: 18px; background: var(--azul-busqueda); border: 2px solid var(--borde-azul); border-radius: 12px; color: var(--texto); font-size: 16px; outline: none; }
        .buscador-bib:focus { border-color: var(--verde-claro); }
        .anuncio-bib { width: 100%; max-width: 420px; min-height: 85px; margin: 0 auto 25px; background: var(--fondo-tarjeta); border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid #1f2937; }
        .rejilla-juegos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 20px; max-width: 580px; margin: 0 auto; }
        .tarjeta { background: var(--fondo-tarjeta); border: 2px solid var(--rojo-acento); border-radius: 16px; padding: 20px 15px; text-align: center; transition: all 0.3s ease; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
        .tarjeta:hover { transform: translateY(-4px); border-color: #ff4d6d; box-shadow: 0 8px 25px rgba(255, 0, 51, 0.18); }
        .logo { width: 85px; height: 85px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; background: #1f2937; }
        .nombre-juego { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
        .descargas { font-size: 13px; color: var(--texto-sutil); margin-bottom: 14px; }
        .btn-desc { width: 100%; padding: 11px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s ease; }
        .bloqueado { background: #1f2937; color: #6b7280; cursor: not-allowed; }
        .desbloqueado { background: linear-gradient(135deg, #15803d, #22c55e); color: white; }
        .pie-pagina { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 35px; }
        .btn-pag { background: var(--fondo-tarjeta); border: 1px solid var(--rojo-acento); color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-pag:hover:not(:disabled) { background: var(--rojo-acento); }
        .btn-pag:disabled { opacity: 0.3; cursor: not-allowed; }
        .num-pag { font-size: 16px; font-weight: bold; min-width: 60px; text-align: center; }
        .boton-mas { position: fixed; bottom: 28px; right: 28px; width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, #ff0033, #ff4d6d); border: none; color: white; font-size: 32px; cursor: pointer; display: none; z-index: 99; box-shadow: 0 4px 20px rgba(255, 0, 51, 0.35); transition: transform 0.2s ease; }
        .boton-mas:hover { transform: scale(1.1); }
        .modo-creador .boton-mas { display: flex; align-items: center; justify-content: center; }
        .capa-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .caja-modal { background: var(--fondo-tarjeta); padding: 30px 25px; border-radius: 18px; border: 2px solid var(--rojo-acento); width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
        .tit-modal { font-size: 20px; font-weight: bold; margin-bottom: 22px; text-align: center; color: var(--verde-claro); }
        .campo { width: 100%; padding: 13px 16px; margin-bottom: 14px; background: #1e293b; border: none; border-radius: 10px; color: white; font-size: 15px; }
        .fila-botones { display: flex; gap: 12px; margin-top: 8px; }
        .boton-modal { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .cancelar { background: #374151; color: white; }
        .publicar { background: linear-gradient(135deg, #15803d, #22c55e); color: white; }
        .pantalla-bloqueo { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300; padding: 30px; }
        .aviso { font-size: 19px; margin-bottom: 35px; text-align: center; color: #d1d5db; }
        .contador-grande { font-size: 70px; font-weight: 800; color: var(--rojo-acento); margin-bottom: 35px; }
        .boton-desc-ya { background: linear-gradient(135deg, #15803d, #22c55e); border: none; color: white; padding: 16px 35px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; display: none; }
        .boton-desc-ya.activo { display: block; }
        .saludo { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #15803d, #22c55e); padding: 22px 35px; border-radius: 14px; font-size: 20px; font-weight: bold; z-index: 400; animation: aparece 0.4s ease; box-shadow: 0 6px 25px rgba(34, 197, 94, 0.3); }
        @keyframes aparece { from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>
<div id="pant-inicio" class="inicio">
    <h1 class="logo-titulo">Leonardo Plebe 🎮</h1>
    <input type="text" id="bus-inicio" class="buscador-inicio" placeholder="Buscar juegos...">
    <div class="anuncio-fila">
        <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
        <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
    </div>
    <button id="btn-ver-bib" class="btn-entrar">🎮 Ver Biblioteca de Juegos</button>
</div>
<div id="pant-bib" class="biblioteca oculto">
    <div class="cabecera">
        <h2 class="titulo-bib">Biblioteca de Juegos</h2>
        <input type="text" id="bus-bib" class="buscador-bib" placeholder="Buscar juegos por nombre...">
        <div class="anuncio-bib">
            <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
            <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
        </div>
    </div>
    <div id="rejilla" class="rejilla-juegos"></div>
    <div class="pie-pagina">
        <button id="btn-antes" class="btn-pag">← Anterior</button>
        <span id="etq-pag" class="num-pag">1 / 1</span>
        <button id="btn-despues" class="btn-pag">Siguiente →</button>
    </div>
    <button id="agregar-juego" class="boton-mas">+</button>
</div>
<div id="modal-publicar" class="capa-modal oculto">
    <div class="caja-modal">
        <h3 class="tit-modal">Publicar Nuevo Juego 🎮</h3>
        <input type="text" id="campo-nombre" class="campo" placeholder="Nombre del juego">
        <input type="text" id="campo-enlace" class="campo" placeholder="Enlace de descarga (MediaFire, etc.)">
        <input type="file" id="campo-logo" accept="image/*" class="campo">
        <div class="fila-botones">
            <button id="btn-cancelar-pub" class="boton-modal cancelar">Cancelar</button>
            <button id="btn-guardar-pub" class="boton-modal publicar">✅ Publicar</button>
        </div>
    </div>
</div>
<div id="pant-bloqueo" class="pantalla-bloqueo oculto">
    <p class="aviso">⏳ Espera 7 segundos para desbloquear la descarga</p>
    <div id="cuenta-atras" class="contador-grande">7</div>
    <button id="boton-descargar-ya" class="boton-desc-ya">← Volver y Descargar</button>
</div>
<script>
const CODIGO_CRE = '2k8L';
const POR_PAG = 10;
const ENLACE_ANUNCIO = 'https://www.profitableratecpmnetwork.com/zg26qqbwk3?key=9a7994b8893e7a6cc73b4cfdc2f064e9';
let soyCreador = false;
let listaJuegos = [];
let pagina = 1;
let juegoEnEspera = null;
let desbloqueado = false;
function cargar() {
    const guardado = localStorage.getItem('juegos_publicos');
    if (guardado) {
        listaJuegos = JSON.parse(guardado);
    } else {
        listaJuegos = [{
            id: Date.now(),
            nombre: "Minecraft",
            enlace: "https://www.mediafire.com/file/vmaz5vp7pf0fu34/minecraft-26-45-music.apk/file?dky=vo0ai7eoxz6&=583",
            imagen: "https://via.placeholder.com/85x85/15803d/ffffff?text=MC",
            descargas: 0
        }];
        guardarTodo();
    }
    dibujar();
}
function guardarTodo() { localStorage.setItem('juegos_publicos', JSON.stringify(listaJuegos)); }
document.getElementById('bus-inicio').addEventListener('keypress', e => {
    if (e.key === 'Enter' && e.target.value.trim() === CODIGO_CRE) { activarCreador(); e.target.value = ''; }
});
document.getElementById('bus-bib').addEventListener('keypress', e => {
    if (e.key === 'Enter' && e.target.value.trim() === CODIGO_CRE) { activarCreador(); e.target.value = ''; }
});
function activarCreador() {
    if (soyCreador) { alert('✅ Ya eres creador'); return; }
    soyCreador = true;
    document.body.classList.add('modo-creador');
    const aviso = document.createElement('div');
    aviso.className = 'saludo';
    aviso.textContent = '✅ Bienvenido, Creador!';
    document.body.appendChild(aviso);
    setTimeout(() => aviso.remove(), 2500);
}
document.getElementById('btn-ver-bib').addEventListener('click', () => {
    document.getElementById('pant-inicio').classList.add('oculto');
    document.getElementById('pant-bib').classList.remove('oculto');
    dibujar();
});
function dibujar(busqueda = '') {
    const caja = document.getElementById('rejilla');
    caja.innerHTML = '';
    let filtro = listaJuegos.filter(j => j.nombre.toLowerCase().includes(busqueda.toLowerCase()));
    const totalPag = Math.ceil(filtro.length / POR_PAG) || 1;
    if (pagina > totalPag) pagina = totalPag;
    const desde = (pagina - 1) * POR_PAG;
    const lote = filtro.slice(desde, desde + POR_PAG);
    lote.forEach(juego => {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta';
        tarjeta.innerHTML = `
            <img src="${juego.imagen}" class="logo" alt="${juego.nombre}">
            <h3 class="nombre-juego">${juego.nombre}</h3>
            <p class="descargas">⬇️ ${juego.descargas || 0} descargas</p>
            <button class="btn-desc ${desbloqueado || soyCreador ? 'desbloqueado' : 'bloqueado'}" data-id="${juego.id}">
                ${desbloqueado || soyCreador ? '✅ Descargar' : '🔒 Ver Anuncio'}
            </button>
        `;
        caja.appendChild(tarjeta);
    });
    document.getElementById('etq-pag').textContent = `${pagina} / ${totalPag}`;
    document.getElementById('btn-antes').disabled = pagina <= 1;
    document.getElementById('btn-despues').disabled = pagina >= totalPag;
    document.querySelectorAll('.btn-desc').forEach(b => b.addEventListener('click', alDescargar));
}
function alDescargar(e) {
    const id = parseInt(e.target.dataset.id);
    const juego = listaJuegos.find(j => j.id === id);
    if (!juego) return;
    if (soyCreador || desbloqueado) {
        window.open(juego.enlace, '_blank');
        juego.descargas = (juego.descargas || 0) + 1;
        guardarTodo();
        dibujar(document.getElementById('bus-bib').value);
    } else {
        juegoEnEspera = juego;
        iniciarCuentaAtras();
    }
}
function iniciarCuentaAtras() {
    desbloqueado = false;
    const pantalla = document.getElementById('pant-bloqueo');
    const cuenta = document.getElementById('cuenta-atras');
    const boton = document.getElementById('boton-descargar-ya');
    pantalla.classList.remove('oculto');
    boton.classList.remove('activo');
    cuenta.textContent = '7';
    window.open(ENLACE_ANUNCIO, '_blank');
    let seg = 7;
    const temporizador = setInterval(() => {
        seg--;
        cuenta.textContent = seg;
        if (seg <= 0) {
            clearInterval(temporizador);
            cuenta.textContent = '✅';
            boton.classList.add('activo');
        }
    }, 1000);
}
document.getElementById('boton-descargar-ya').addEventListener('click', () => {
    desbloqueado = true;
    document.getElementById('pant-bloqueo').classList.add('oculto');
    if (juegoEnEspera) {
        window.open(juegoEnEspera.enlace, '_blank');
        juegoEnEspera.descargas = (juegoEnEspera.descargas || 0) + 1;
        guardarTodo();
        juegoEnEspera = null;
    }
    dibujar(document.getElementById('bus-bib').value);
});
document.getElementById('bus-bib').addEventListener('input', e => { pagina = 1; dibujar(e.target.value); });
document.getElementById('btn-antes').addEventListener('click', () => { if (pagina > 1) { pagina--; dibujar(); } });
document.getElementById('btn-despues').addEventListener('click', () => { pagina++; dibujar(); });
document.getElementById('agregar-juego').addEventListener('click', () => { document.getElementById('modal-publicar').classList.remove('oculto'); });
document.getElementById('btn-cancelar-pub').addEventListener('click', () => { document.getElementById('modal-publicar').classList.add('oculto'); limpiarCampos(); });
document.getElementById('btn-guardar-pub').addEventListener('click', () => {
    const nom = document.getElementById('campo-nombre').value.trim();
    const enl = document.getElementById('campo-enlace').value.trim();
    const arch = document.getElementById('campo-logo').files[0];
    if (!nom || !enl) { alert('⚠️ Escribe nombre y enlace'); return; }
    function guardar(imagen) {
        listaJuegos.unshift({ id: Date.now(), nombre: nom, enlace: enl, imagen: imagen, descargas: 0 });
        guardarTodo();
        dibujar();
        document.getElementById('modal-publicar').classList.add('oculto');
        limpiarCampos();
        alert('✅ ¡Publicado! Todos lo ven');
    }
    if (arch) {
        const lector = new FileReader();
        lector.onload = e => {
            const img = new Image();
            img.onload = () => {
                const lienzo = document.createElement('canvas');
                lienzo.width = 100;
                lienzo.height = 100;
                const ctx = lienzo.getContext('2d');
                ctx.drawImage(img, 0, 0, 100, 100);
                guardar(lienzo.toDataURL('image/jpeg', 0.7));
            };
            img.src = e.target.result;
        };
        lector.readAsDataURL(arch);
    } else { guardar('https://via.placeholder.com/85x85/15803d/ffffff?text=🎮'); }
});
function limpiarCampos() {
    document.getElementById('campo-nombre').value = '';
    document.getElementById('campo-enlace').value = '';
    document.getElementById('campo-logo').value = '';
}
window.addEventListener('beforeunload', () => { desbloqueado = false; soyCreador = false; document.body.classList.remove('modo-creador'); });
cargar();
</script>
</body>
</html>
