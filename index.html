<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonardo Plebe 🎮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
            position: relative;
        }
        
        /* Anuncio superior */
        .anuncio-superior { 
            background: #111; 
            padding: 12px; 
            text-align: center; 
            border-bottom: 2px solid #2ecc71;
            z-index: 10;
            position: relative;
        }
        
        /* Contenido principal centrado */
        .contenido { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 60px 20px; 
            text-align: center; 
            min-height: 80vh;
            position: relative;
            z-index: 5;
        }
        .logo { font-size: 60px; margin-bottom: 15px; }
        h1 { color: #2ecc71; font-size: 42px; margin-bottom: 10px; }
        .subtitulo { color: #ccc; font-size: 18px; margin-bottom: 40px; }
        
        /* Botón bien visible */
        .btn { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 18px 35px; 
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 80%; 
            max-width: 350px; 
            transition: transform 0.2s;
            position: relative;
            z-index: 20;
        }
        .btn:hover { transform: scale(1.05); }
        
        /* Anuncio inferior */
        .anuncio-inferior { 
            background: #111; 
            padding: 12px; 
            text-align: center; 
            border-top: 2px solid #2ecc71;
            margin-top: auto;
        }

        /* Estilo para centrar el anuncio de ventana */
        .contenedor-anuncio-ventana {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- 📢 ANUNCIO DE ARRIBA -->
    <div class="anuncio-superior">
        <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
        <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
    </div>

    <!-- 🎮 CONTENIDO PRINCIPAL -->
    <div class="contenido">
        <div class="logo">🎮</div>
        <h1>Leonardo Plebe</h1>
        <p class="subtitulo">Los mejores juegos — descarga gratis</p>
        <button class="btn" onclick="alert('Próximamente! 🚀')">📚 Biblioteca de Juegos</button>
    </div>

    <!-- 📢 ANUNCIO DE VENTANA — CENTRADO, FÁCIL DE CERRAR -->
    <div class="contenedor-anuncio-ventana">
        <script src="https://pl31361169.profitableratecpmnetwork.com/22/e5/ce/22e5ce45b7f08d83a957b7a61350ecf6.js"></script>
    </div>

    <!-- 📢 ANUNCIO DE ABAJO -->
    <div class="anuncio-inferior">
        Tu publicidad — Gana con cada visita 💰
    </div>

</body>
</html>
