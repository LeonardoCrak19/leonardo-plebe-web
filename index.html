<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonardo Plebe 🎮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .oculto { display: none !important; }

        /* --- INICIO --- */
        .inicio { flex: 1; display: flex; flex-direction: column; padding: 50px 20px 20px; text-align: center; }
        .zona-principal { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .logo { font-size: 70px; margin-bottom: 10px; }
        h1 { color: #2ecc71; font-size: 36px; margin-bottom: 10px; }
        .subtitulo { color: #aaa; font-size: 16px; margin-bottom: 40px; }
        .btn-entrar {
            background: #fff; color: #000; border: none;
            padding: 18px 36px; font-size: 20px; font-weight: bold;
            border-radius: 14px; cursor: pointer; width: 85%; max-width: 320px;
            transition: transform 0.2s;
        }
        .btn-entrar:hover { transform: scale(1.05); }
        
        /* ANUNCIO ABAJO */
        .zona-anuncios { width: 100%; padding: 15px 20px; border-top: 1px solid #222; margin-top: auto; }
        .anuncio { width: 100%; max-width: 400px; margin: 0 auto; min-height: 220px; }

        /* --- BIBLIOTECA --- */
        .cabecera { padding: 15px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #000; z-index: 50; }
        .barra-busqueda {
            width: 100%; padding: 12px 16px; border-radius: 10px; border: none;
            background: #1a1a2e; color: #fff; font-size: 15px; text-align: center;
        }
        .barra-busqueda::placeholder { color: #666; }

        .bienvenida {
            text-align: center; color: #2ecc71; padding: 10px; margin: 10px 15px;
            background: rgba(46,204,113,0.1); border-radius: 8px;
            font-weight: bold; animation: aparecer 0.4s ease-out;
        }
        @keyframes aparecer { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

        .lista-juegos { padding: 15px; flex: 1; }
        .juego { display: flex; align-items: center; background: #111; padding: 12px; border-radius: 10px; margin-bottom: 12px; border-left: 3px solid #ff0033; }
        .juego-img { width: 55px; height: 55px; border-radius: 8px; background: #222; margin-right: 12px; object-fit: cover; }
        .juego-info { flex: 1; }
        .juego-nombre { font-weight: bold; margin-bottom: 3px; font-size: 15px; }
        .etapa { font-size: 11px; color: #888; margin-bottom: 3px; }
        .contador { font-size: 11px; color: #2ecc71; font-weight: bold; }
        .contador-num { background: rgba(46,204,113,0.2); padding: 1px 6px; border-radius: 8px; font-size: 12px; }
        
        .descargar-bloqueado {
            background: #333; color: #777; border: none; padding: 8px 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
        }
        .descargar-listo {
            background: #2ecc71; color: #000; border: none; padding: 8px 12px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;
            text-decoration: none;
        }

        .paginacion { display: flex; justify-content: center; align-items: center; gap: 5px; padding: 15px; border-top: 1px solid #111; }
        .pagina-texto { color: #777; font-size: 12px; margin-right: 6px; }
        .pagina-btn { background: #222; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; min-width: 36px; }
        .pagina-btn:hover, .pagina-activa { background: #2ecc71; color: #000; font-weight: bold; }
        .pagina-btn:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }
        .puntos { color: #555; padding: 0 3px; }

        .boton-creador {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            border-radius: 50%; background: #2ecc71; color: #000; border: none;
            font-size: 28px; font-weight: bold; cursor: pointer; z-index: 100;
            box-shadow: 0 3px 12px rgba(46,204,113,0.35);
        }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center;
            z-index: 200; padding: 20px;
        }
        .form-publicar { background: #111; padding: 22px; border-radius: 12px; width: 100%; max-width: 340px; }
        .form-publicar h3 { text-align: center; margin-bottom: 18px; color: #2ecc71; font-size: 20px; }
        .form-publicar input {
            width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px;
            border: none; background: #222; color: #fff; font-size: 14px;
        }
        .btn-imagen {
            width: 100%; padding: 14px; background: #222; border: 2px dashed #2ecc71;
            color: #fff; border-radius: 8px; text-align: center; cursor: pointer; margin-bottom: 12px;
            font-size: 15px;
        }
        .vista-previa { width: 90px; height: 90px; border-radius: 8px; margin: 0 auto 15px; background: #333; object-fit: cover; display: block; }
        .codigo-salida {
            background: #1a1a1a; border: 1px solid #2ecc71; padding: 12px; border-radius: 8px;
            margin: 15px 0; font-family: monospace; font-size: 11px; word-break: break-all; color: #90ee90;
        }
        .botones { display: flex; gap: 10px; margin-top: 8px; }
        .btn-cancelar { flex: 1; padding: 14px; border: none; border-radius: 8px; background: #444; color: #fff; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-publicar { flex: 1; padding: 14px; border: none; border-radius: 8px; background: #2ecc71; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; }
        input[type="file"] { display: none; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <!-- INICIO -->
    <div id="pagina-inicio" class="inicio">
        <div class="zona-principal">
            <div class="logo">🎮</div>
            <h1>Leonardo Plebe</h1>
            <p class="subtitulo">Los mejores juegos — descarga gratis</p>
            <button class="btn-entrar" onclick="abrirBiblioteca()">📚 Biblioteca de Juegos</button>
        </div>
        <div class="zona-anuncios">
            <div class="anuncio">
                <script async="async" data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
                <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
            </div>
        </div>
    </div>

    <!-- BIBLIOTECA -->
    <div id="pagina-biblioteca" class="oculto" style="display:flex;flex-direction:column;min-height:100vh;">
        <div class="cabecera">
            <input type="text" class="barra-busqueda" id="buscar" placeholder="Buscar juegos, apps y más..." oninput="filtrarJuegos(this.value)" onkeydown="verificarCodigo(event)">
        </div>
        
        <div id="mensaje-bienvenida" class="bienvenida oculto">✅ Bienvenido, Creador! Toca el + para publicar 🎮</div>
        
        <div class="lista-juegos" id="lista-juegos">
            <p style="text-align:center;color:#777;padding:40px;">No hay juegos publicados todavía 🎮</p>
        </div>
        <div class="paginacion" id="paginacion"></div>
        
        <button id="boton-mas" class="boton-creador oculto" onclick="abrirFormulario()">+</button>
        
        <!-- FORMULARIO DE PUBLICACIÓN -->
        <div id="formulario-modal" class="modal oculto">
            <div class="form-publicar">
                <h3>Publicar Juego</h3>
                <input type="text" id="nombre-juego" placeholder="Nombre del juego">
                <input type="text" id="enlace-juego" placeholder="Enlace de descarga">
                
                <div class="btn-imagen" onclick="document.getElementById('logo-juego').click()">
                    📷 Elegir imagen / logo
                </div>
                <img id="vista-previa-img" class="vista-previa" src="" alt="Vista previa">
                <input type="file" id="logo-juego" accept="image/*" onchange="cargarImagen(event)">
                
                <div id="caja-codigo" class="oculto">
                    <p style="color:#90ee90; font-size:13px; margin:10px 0 5px 0;">📋 Copia este código y pégalo en tu archivo index.html donde dice: let juegos = [ AQUÍ ]</p>
                    <div id="codigo-generado" class="codigo-salida"></div>
                </div>
                
                <div class="botones">
                    <button class="btn-cancelar" onclick="cerrarFormulario()">Cancelar</button>
                    <button id="btn-publicar-ahora" class="btn-publicar" onclick="generarCodigo()">Publicar</button>
                </div>
            </div>
        </div>
    </div>

<script>
const CODIGO_CREADOR = "2k8L";
const ENLACE_ANUNCIO = "https://pl31361169.profitableratecpmnetwork.com/22/e5/ce/22e5ce45b7f08d83a957b7a61350ecf6.js";
const JUEGOS_POR_PAGINA = 10;

// ==============================================
// AQUÍ VAN TUS JUEGOS — PEGA DEBAJO CADA NUEVO
// ==============================================
let juegos = [
    // EJEMPLO: {id: 1, nombre: "Juego", enlace: "https://...", imagen: "data...", descargas: 0}
];

let imagenSeleccionada = null;
let paginaActual = 1;
let listaFiltrada = [...juegos];

// REINICIAR DESBLOQUEO AL CERRAR EL NAVEGADOR ✅
let desbloqueadoAhora = sessionStorage.getItem('desbloqueado_juego');
if (desbloqueadoAhora) desbloqueadoAhora = null;

function abrirBiblioteca() {
    document.getElementById('pagina-inicio').classList.add('oculto');
    document.getElementById('pagina-biblioteca').classList.remove('oculto');
    listaFiltrada = [...juegos];
    paginaActual = 1;
    mostrarJuegos();
}

function verificarCodigo(e) {
    if (e.key === 'Enter') {
        const t = document.getElementById('buscar').value.trim();
        if (t === CODIGO_CREADOR) {
            document.getElementById('boton-mas').classList.remove('oculto');
            document.getElementById('mensaje-bienvenida').classList.remove('oculto');
            document.getElementById('buscar').value = '';
        }
    }
}

// CARGAR IMAGEN DESDE GALERÍA ✅
function cargarImagen(e) {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = function(resultado) {
        imagenSeleccionada = resultado.target.result;
        document.getElementById('vista-previa-img').src = imagenSeleccionada;
    };
    lector.readAsDataURL(archivo);
}

function abrirFormulario() {
    document.getElementById('formulario-modal').classList.remove('oculto');
    document.getElementById('caja-codigo').classList.add('oculto');
    document.getElementById('codigo-generado').textContent = '';
}

function cerrarFormulario() {
    document.getElementById('formulario-modal').classList.add('oculto');
    document.getElementById('nombre-juego').value = '';
    document.getElementById('enlace-juego').value = '';
    document.getElementById('vista-previa-img').src = '';
    imagenSeleccionada = null;
}

// GENERAR CÓDIGO AUTOMÁTICAMENTE ✅
function generarCodigo() {
    const nombre = document.getElementById('nombre-juego').value.trim();
    const enlace = document.getElementById('enlace-juego').value.trim();
    
    if (!nombre) return alert('Pon el nombre del juego 🎮');
    if (!enlace) return alert('Pon el enlace de descarga 🔗');
    if (!imagenSeleccionada) return alert('Elige una imagen/logo 📷');
    
    const idNuevo = Date.now();
    const codigoListo = `{id: ${idNuevo}, nombre: "${nombre}", enlace: "${enlace}", imagen: "${imagenSeleccionada}", descargas: 0}`;
    
    // MOSTRAR CÓDIGO YA HECHO ✅
    document.getElementById('codigo-generado').textContent = codigoListo;
    document.getElementById('caja-codigo').classList.remove('oculto');
    
    // Copiar automáticamente
    navigator.clipboard.writeText(codigoListo).then(() => {
        alert('✅ ¡Copiado automáticamente!\n\n👉 Pégalo en tu código donde dice: let juegos = [ AQUÍ ]');
    }).catch(() => {
        alert('📋 Copia el código que aparece en verde y pégalo en tu código base');
    });
}

function formatoNumero(n) { return n >= 1000 ? (n/1000).toFixed(1) + ' mil' : n.toString(); }

function mostrarJuegos() {
    const total = listaFiltrada.length;
    const totalPaginas = Math.ceil(total / JUEGOS_POR_PAGINA);
    if (paginaActual > totalPaginas && totalPaginas > 0) paginaActual = totalPaginas;
    if (totalPaginas === 0) paginaActual = 1;

    const inicio = (paginaActual - 1) * JUEGOS_POR_PAGINA;
    const fin = inicio + JUEGOS_POR_PAGINA;
    const juegosPagina = listaFiltrada.slice(inicio, fin);

    const c = document.getElementById('lista-juegos');
    c.innerHTML = '';

    if (juegosPagina.length === 0) {
        c.innerHTML = '<p style="text-align:center;color:#777;padding:40px;">No hay juegos publicados todavía 🎮</p>';
    } else {
        juegosPagina.forEach(juego => {
            const yaDesbloqueado = desbloqueadoAhora === String(juego.id);
            const tarjeta = document.createElement('div');
            tarjeta.className = 'juego';
            tarjeta.innerHTML = `
                <img class="juego-img" src="${juego.imagen}" alt="${juego.nombre}">
                <div class="juego-info">
                    <div class="juego-nombre">${juego.nombre}</div>
                    <div class="etapa">${yaDesbloqueado ? '✅ Listo' : '🔒 Toca para ver anuncio'}</div>
                    <div class="contador">🔥 <span class="contador-num">${formatoNumero(juego.descargas)} descargas</span></div>
                </div>
                ${yaDesbloqueado 
                    ? `<a href="${juego.enlace}" target="_blank" class="descargar-listo" onclick="sumarDescarga(${juego.id})">⬇️</a>`
                    : `<button class="descargar-bloqueado" onclick="desbloquear(${juego.id})">🔓</button>`
                }
            `;
            c.appendChild(tarjeta);
        });
    }
    dibujarPaginacion(totalPaginas);
}

function dibujarPaginacion(totalPaginas) {
    const c = document.getElementById('paginacion');
    if (totalPaginas <= 1) { c.innerHTML = ''; return; }
    let html = `<span class="pagina-texto">Pág ${paginaActual} de ${totalPaginas}</span>`;
    html += `<button class="pagina-btn" ${paginaActual === 1 ? 'disabled' : ''} onclick="irPagina(${paginaActual - 1})">←</button>`;
    
    const rango = 2;
    let mostrados = [];
    for (let i = 1; i <= totalPaginas; i++) {
        if (i === 1 || i === totalPaginas || (i >= paginaActual - rango && i <= paginaActual + rango)) {
            mostrados.push(i);
        } else if (mostrados[mostrados.length - 1] !== '...') {
            mostrados.push('...');
        }
    }
    mostrados.forEach(p => {
        if (p === '...') html += `<span class="puntos">...</span>`;
        else {
            const activa = p === paginaActual ? 'pagina-activa' : '';
            html += `<button class="pagina-btn ${activa}" onclick="irPagina(${p})">${p}</button>`;
        }
    });
    html += `<button class="pagina-btn" ${paginaActual === totalPaginas ? 'disabled' : ''} onclick="irPagina(${paginaActual + 1})">→</button>`;
    c.innerHTML = html;
}

function irPagina(n) { paginaActual = n; window.scrollTo({top:0}); mostrarJuegos(); }

function sumarDescarga(id) {
    const juego = juegos.find(j => j.id === id);
    if (juego) {
        juego.descargas += 1;
        mostrarJuegos();
    }
}

function desbloquear(id) {
    window.open(ENLACE_ANUNCIO, '_blank');
    desbloqueadoAhora = String(id);
    sessionStorage.setItem('desbloqueado_juego', String(id));
    setTimeout(mostrarJuegos, 500);
}

function normalizar(t) {
    return t.toLowerCase().replace(/[áéíóúñ]/g, m => ({á:'a',é:'e',í:'i',ó:'o',ú:'u',ñ:'n'}[m]));
}
function filtrarJuegos(texto) {
    listaFiltrada = texto.trim() === '' ? [...juegos] : juegos.filter(j => normalizar(j.nombre).includes(normalizar(texto)));
    paginaActual = 1;
    mostrarJuegos();
}

mostrarJuegos();
</script>
</body>
</html>
