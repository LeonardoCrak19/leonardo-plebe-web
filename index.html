<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071119">
  <title>Leonardo Plebe 🎮</title>
  <style>
    :root{
      --bg:#050a10;
      --card:#0d1725;
      --green:#22c55e;
      --green2:#15803d;
      --blue:#1e40af;
      --red:#ef4444;
      --text:#f8fafc;
      --muted:#94a3b8;
      --line:#ffffff15;
    }

    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      padding-bottom:30px;
    }
    button,input{font:inherit}
    button{cursor:pointer;border:0}
    input{outline:0;border:1px solid var(--line)}
    .hidden{display:none!important}

    /* === INICIO === */
    .home{
      max-width:1200px;
      margin:0 auto;
      padding:40px 20px;
      text-align:center;
    }
    .brand{font-size:clamp(2rem,5vw,3.5rem);margin-bottom:10px}
    .subtitle{color:var(--muted);margin-bottom:30px}
    .search-bar{
      display:flex;
      gap:10px;
      max-width:500px;
      margin:0 auto 30px;
    }
    .search{
      flex:1;
      padding:14px 18px;
      border-radius:12px;
      background:var(--card);
      color:var(--text);
      border:1px solid var(--line);
      font-size:16px;
    }
    .btn-primary{
      padding:14px 24px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700;
      font-size:16px;
    }
    .ad-space{
      max-width:720px;
      margin:0 auto 30px;
      padding:20px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#ffffff05;
    }
    .enter-btn{
      padding:16px 40px;
      font-size:18px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700;
    }

    /* === BIBLIOTECA === */
    .library{
      max-width:1200px;
      margin:0 auto;
      padding:30px 20px;
    }
    .header-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      flex-wrap:wrap;
      gap:15px;
    }
    .back-btn{
      background:transparent;
      color:var(--muted);
      font-size:16px;
      padding:8px 12px;
    }
    .back-btn:hover{color:var(--text)}
    .page-title{font-size:clamp(1.5rem,3vw,2rem)}
    .library-search{
      display:flex;
      gap:10px;
      margin-bottom:30px;
    }
    .games-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:25px;
    }
    .game-card{
      background:var(--card);
      border-radius:16px;
      overflow:hidden;
      border:1px solid var(--line);
      transition:transform .2s,border-color .2s;
    }
    .game-card:hover{
      transform:translateY(-4px);
      border-color:var(--green);
    }
    .game-img{
      width:100%;
      height:200px;
      object-fit:cover;
      background:#1a2e35;
    }
    .game-info{padding:18px}
    .game-name{font-size:18px;font-weight:700;margin-bottom:8px}
    .game-meta{
      color:var(--muted);
      font-size:14px;
      margin-bottom:15px;
    }
    .btn-download{
      width:100%;
      padding:12px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700;
      font-size:15px;
      margin-bottom:10px;
    }
    .btn-locked{
      background:#333;
      color:#888;
      cursor:not-allowed
    }
    .creator-actions{
      display:flex;
      gap:8px;
      margin-top:10px
    }
    .btn-edit{
      flex:1;
      padding:10px;
      border-radius:8px;
      background:var(--blue);
      color:#fff;
      font-weight:600
    }
    .btn-delete{
      flex:1;
      padding:10px;
      border-radius:8px;
      background:var(--red);
      color:#fff;
      font-weight:600
    }
    .fab-add{
      position:fixed;
      bottom:25px;
      right:25px;
      width:60px;
      height:60px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-size:28px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 4px 15px #0006;
      z-index:100
    }
    .pagination{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      margin-top:40px
    }
    .page-btn{
      padding:10px 16px;
      border-radius:8px;
      background:var(--card);
      color:var(--text);
      border:1px solid var(--line)
    }
    .page-btn:disabled{opacity:.4;cursor:not-allowed}

    /* === MODAL === */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:#000c;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:200
    }
    .modal{
      background:var(--card);
      border-radius:16px;
      padding:25px;
      max-width:450px;
      width:100%;
      border:1px solid var(--line)
    }
    .modal h3{margin-bottom:20px;text-align:center}
    .modal input{
      width:100%;
      padding:12px 15px;
      margin-bottom:12px;
      border-radius:10px;
      background:#0003;
      color:var(--text);
      border:1px solid var(--line);
      font-size:15px
    }
    .modal-actions{
      display:flex;
      gap:10px;
      margin-top:10px
    }
    .btn-cancel{
      flex:1;
      padding:12px;
      border-radius:10px;
      background:#333;
      color:#fff;
      font-weight:600
    }
    .btn-save{
      flex:1;
      padding:12px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:#000;
      font-weight:700
    }

    /* === ANUNCIO / BLOQUEO === */
    .lock-modal{
      position:fixed;
      inset:0;
      background:#000e;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:300
    }
    .lock-box{
      background:var(--card);
      border-radius:16px;
      padding:30px;
      max-width:400px;
      width:100%;
      text-align:center;
      border:1px solid var(--line)
    }
    .lock-count{
      font-size:3rem;
      font-weight:700;
      color:var(--green);
      margin:20px 0
    }
    .btn-ad{
      width:100%;
      padding:14px;
      border-radius:10px;
      background:linear-gradient(135deg,#f97316,#ea580c);
      color:#fff;
      font-weight:700;
      font-size:16px;
      margin-bottom:12px
    }
    .btn-unlock{
      width:100%;
      padding:14px;
      border-radius:10px;
      background:var(--green);
      color:#000;
      font-weight:700;
      font-size:16px;
      display:none
    }
    .btn-unlock.visible{display:block}
  </style>
</head>
<body>

  <!-- === PÁGINA DE INICIO === -->
  <div id="homePage" class="home">
    <h1 class="brand">Leonardo Plebe 🎮</h1>
    <p class="subtitle">Tus juegos favoritos en un solo lugar</p>
    
    <div class="search-bar">
      <input id="homeSearch" class="search" type="text" placeholder="Buscar juegos...">
      <button id="homeSearchBtn" class="btn-primary">Buscar</button>
    </div>

    <div class="ad-space">
      <script async data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script>
      <div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div>
    </div>

    <button id="enterBtn" class="enter-btn">🎮 Ver Biblioteca</button>
  </div>

  <!-- === BIBLIOTECA === -->
  <div id="libraryPage" class="library hidden">
    <div class="header-top">
      <button id="backHome" class="back-btn">← Volver</button>
      <h2 class="page-title">Biblioteca de Juegos</h2>
      <span id="gameCount" class="muted">0 juegos</span>
    </div>

    <div class="library-search">
      <input id="libSearch" class="search" type="text" placeholder="Buscar por nombre...">
      <button id="libSearchBtn" class="btn-primary">Buscar</button>
    </div>

    <div id="gamesGrid" class="games-grid"></div>

    <div class="pagination">
      <button id="prevPage" class="page-btn">←</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPage" class="page-btn">→</button>
    </div>

    <button id="fabAdd" class="fab-add hidden">+</button>
  </div>

  <!-- === MODAL AGREGAR/EDITAR === -->
  <div id="gameModal" class="modal-backdrop hidden">
    <div class="modal">
      <h3 id="modalTitle">Agregar Juego 🎮</h3>
      <input id="gameName" type="text" placeholder="Nombre del juego">
      <input id="gameLink" type="url" placeholder="Enlace de descarga">
      <input id="gameImageUrl" type="url" placeholder="🔗 Enlace directo de imagen">
      <input id="gameImageFile" type="file" accept="image/*">
      <img id="imgPreview" class="hidden" style="width:100%;border-radius:10px;margin:10px 0" alt="Vista previa">
      <div class="modal-actions">
        <button id="modalCancel" class="btn-cancel">Cancelar</button>
        <button id="modalSave" class="btn-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- === BLOQUEO DE ANUNCIO === -->
  <div id="lockModal" class="lock-modal hidden">
    <div class="lock-box">
      <h2>🔒 Desbloquear Descarga</h2>
      <p>Ve el anuncio para obtener el enlace</p>
      <div id="lockCount" class="lock-count">7</div>
      <button id="goAdBtn" class="btn-ad">🌐 Abrir Anuncio</button>
      <button id="unlockBtn" class="btn-unlock">✅ Ya lo vi — Descargar</button>
    </div>
  </div>

<script>
'use strict';

const CREATOR_CODE = '2k8L';
const PAGE_SIZE = 6;
const AD_URL = 'https://www.profitableratecpmnetwork.com/zg26qqbwk3?key=9a7994b8893e7a6cc73b4cfdc2f064e9';
const FALLBACK_IMG = 'https://via.placeholder.com/280x200/0d1725/ffffff?text=🎮';

let games = [];
let currentPage = 1;
let searchQuery = '';
let isCreator = false;
let pendingGame = null;
let isUnlocked = false;
let countdownTimer = null;
let editingId = null;

const $ = id => document.getElementById(id);

// === JUEGOS INCLUIDOS DESDE EL INICIO ===
const DEFAULT_GAMES = [
  {
    id: 1789934945734,
    name: "Minecraft",
    link: "https://www.mediafire.com/file/cim5n289rfeguzn/mc%201.26.45.1%20-%20espacioapk.com.apk/file?dkey=l5wy06u4df0&r=577",
    image: "https://i.imgur.com/I4f3CVY.jpg",
    downloads: 3
  },
  {
    id: 1789935000001,
    name: "Bulma Adventure 3",
    link: "https://www.mediafire.com/file/tjoxvvu7hg7g0j6/Bulma%20Adventure%203%20v1.0%20-%20espacioapk.com.apk/file?dkey=ek6a12ukl68&r=1259",
    image: "https://i.imgur.com/vHLKb6n.jpg",
    downloads: 0
  },
  {
    id: 1789935000002,
    name: "Bulma Adventure",
    link: "https://espacioapk.co/apk/Bulma%20Adventure%201%20v1.00%20-%20espacioapk.com.apk",
    image: "https://i.imgur.com/3QMpOBC.jpg",
    downloads: 0
  },
  {
    id: 1789935000003,
    name: "Five Nights in Anime RX Edition",
    link: "https://download2391.mediafire.com/7ozvcnr8dkwgaejggLepLRuFXKM7UhReZSwIJNYVWTHU3dofbyYp8DkQueNnljEJvsgpqFUjHVM388TVfyYnSfPx4cIUBEwEddxavDtmyJfW0VLqMWSCmpkugM1cXGWaZMaPEvWOmBMccZMYhW7q6TD30zWeGp5H8vCRS-xQEdHI0g/xss34jppa8wufgt/FNIA+RX+v1.5+-+espacioapk.com.apk",
    image: "https://i.imgur.com/pl7HGVi.jpg",
    downloads: 0
  },
  {
    id: 1789935000004,
    name: "Ho My Waifu",
    link: "https://www.mediafire.com/file/h22r0k79uxaldic/OMW+(1).apk/file",
    image: "https://i.imgur.com/IuHm7vE.jpg",
    downloads: 0
  }
];

// === CARGA Y GUARDADO ===
function saveGames() {
  localStorage.setItem('leonardoGames', JSON.stringify(games));
}

function loadGames() {
  const stored = localStorage.getItem('leonardoGames');
  if (stored) {
    try { games = JSON.parse(stored); }
    catch { games = [...DEFAULT_GAMES]; }
  } else {
    games = [...DEFAULT_GAMES];
  }
  renderGames();
}

// === FILTRO Y PAGINACIÓN ===
function getFilteredGames() {
  if (!searchQuery) return games;
  const q = searchQuery.toLowerCase();
  return games.filter(g => g.name.toLowerCase().includes(q));
}

function renderGames() {
  const filtered = getFilteredGames();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageGames = filtered.slice(start, start + PAGE_SIZE);
  const grid = $('gamesGrid');

  if (pageGames.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">No se encontraron juegos</p>';
  } else {
    grid.innerHTML = pageGames.map(game => `
      <div class="game-card">
        <img class="game-img" src="${game.image || FALLBACK_IMG}" alt="${game.name}" onerror="this.src='${FALLBACK_IMG}'">
        <div class="game-info">
          <h3 class="game-name">${game.name}</h3>
          <p class="game-meta">📥 ${game.downloads || 0} descargas</p>
          <button class="btn-download ${(!isCreator && !isUnlocked) ? 'btn-locked' : ''}" data-id="${game.id}">
            ${(!isCreator && !isUnlocked) ? '🔒 Ver Anuncio' : '✅ Descargar'}
          </button>
          ${isCreator ? `
            <div class="creator-actions">
              <button class="btn-edit" data-edit="${game.id}">✏️ Editar</button>
              <button class="btn-delete" data-del="${game.id}">🗑️ Eliminar</button>
            </div>
          ` : ''}
        </div>
      </div>
    `).join('');
  }

  $('gameCount').textContent = `${filtered.length} juego${filtered.length !== 1 ? 's' : ''}`;
  $('pageInfo').textContent = `${currentPage} / ${totalPages}`;
  $('prevPage').disabled = currentPage <= 1;
  $('nextPage').disabled = currentPage >= totalPages;
}

// === NAVEGACIÓN ===
function showHome() {
  $('homePage').classList.remove('hidden');
  $('libraryPage').classList.add('hidden');
  searchQuery = '';
  $('homeSearch').value = '';
  // Detectar código de creador en búsqueda
}

function showLibrary() {
  $('homePage').classList.add('hidden');
  $('libraryPage').classList.remove('hidden');
  $('fabAdd').classList.toggle('hidden', !isCreator);
  currentPage = 1;
  renderGames();
}

// === ANUNCIO Y DESCARGA ===
function openLockModal(game) {
  pendingGame = game;
  isUnlocked = false;
  $('unlockBtn').classList.remove('visible');
  $('lockCount').textContent = '7';
  $('lockModal').classList.remove('hidden');
  
  if (countdownTimer) clearInterval(countdownTimer);
  let sec = 7;
  countdownTimer = setInterval(() => {
    sec--;
    $('lockCount').textContent = sec;
    if (sec <= 0) {
      clearInterval(countdownTimer);
      $('unlockBtn').classList.add('visible');
    }
  }, 1000);
}

function doDownload(game) {
  game.downloads = (game.downloads || 0) + 1;
  saveGames();
  window.open(game.link, '_blank');
  renderGames();
}

// === MODAL ===
function openAddModal() {
  editingId = null;
  $('modalTitle').textContent = 'Agregar Juego 🎮';
  $('gameName').value = '';
  $('gameLink').value = '';
  $('gameImageUrl').value = '';
  $('gameImageFile').value = '';
  $('imgPreview').classList.add('hidden');
  $('gameModal').classList.remove('hidden');
}

function openEditModal(game) {
  editingId = game.id;
  $('modalTitle').textContent = 'Editar Juego ✏️';
  $('gameName').value = game.name;
  $('gameLink').value = game.link;
  $('gameImageUrl').value = '';
  $('gameImageFile').value = '';
  $('imgPreview').src = game.image || FALLBACK_IMG;
  $('imgPreview').classList.remove('hidden');
  $('gameModal').classList.remove('hidden');
}

function closeModal() {
  $('gameModal').classList.add('hidden');
  editingId = null;
}

async function saveGameData() {
  const name = $('gameName').value.trim();
  const link = $('gameLink').value.trim();
  const imgUrl = $('gameImageUrl').value.trim();
  const imgFile = $('gameImageFile').files[0];

  if (!name || !link) {
    alert('⚠️ Nombre y enlace son obligatorios');
    return;
  }

  let image = FALLBACK_IMG;
  if (imgUrl && imgUrl.startsWith('http')) {
    image = imgUrl;
  } else if (imgFile) {
    image = await new Promise(res => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(imgFile);
    });
  }

  if (editingId) {
    const idx = games.findIndex(g => g.id === editingId);
    if (idx !== -1) {
      games[idx] = { ...games[idx], name, link, image };
    }
  } else {
    games.unshift({
      id: Date.now(),
      name,
      link,
      image,
      downloads: 0
    });
  }

  saveGames();
  closeModal();
  renderGames();
}

function deleteGame(id) {
  if (!confirm('¿Eliminar este juego? No se puede deshacer.')) return;
  games = games.filter(g => g.id !== id);
  saveGames();
  renderGames();
}

// === DETECTAR CÓDIGO CREADOR ===
function checkCreatorCode(input) {
  if (input.trim() === CREATOR_CODE) {
    isCreator = true;
    alert('✅ ¡Bienvenido Creador!');
    showLibrary();
    return true;
  }
  return false;
}

// === EVENTOS ===
$('enterBtn').addEventListener('click', showLibrary);
$('backHome').addEventListener('click', showHome);

$('homeSearchBtn').addEventListener('click', () => {
  const val = $('homeSearch').value.trim();
  if (checkCreatorCode(val)) return;
  searchQuery = val;
  showLibrary();
});
$('homeSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = $('homeSearch').value.trim();
    if (checkCreatorCode(val)) return;
    searchQuery = val;
    showLibrary();
  }
});

$('libSearchBtn').addEventListener('click', () => {
  searchQuery = $('libSearch').value.trim();
  currentPage = 1;
  renderGames();
});
$('libSearch').addEventListener('input', () => {
  searchQuery = $('libSearch').value.trim();
  currentPage = 1;
  renderGames();
});

$('prevPage').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderGames(); } });
$('nextPage').addEventListener('click', () => { currentPage++; renderGames(); });

$('fabAdd').addEventListener('click', openAddModal);
$('modalCancel').addEventListener('click', closeModal);
$('modalSave').addEventListener('click', saveGameData);

$('gameImageFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    $('imgPreview').src = ev.target.result;
    $('imgPreview').classList.remove('hidden');
  };
  r.readAsDataURL(f);
});

// Delegar clics en tarjetas
document.addEventListener('click', e => {
  const dl = e.target.closest('.btn-download');
  if (dl) {
    const id = parseInt(dl.dataset.id);
    const game = games.find(g => g.id === id);
    if (!game) return;
    if (isCreator || isUnlocked) {
      doDownload(game);
    } else {
      openLockModal(game);
    }
  }

  const ed = e.target.closest('[data-edit]');
  if (ed) {
    const id = parseInt(ed.dataset.edit);
    const game = games.find(g => g.id === id);
    if (game) openEditModal(game);
  }

  const de = e.target.closest('[data-del]');
  if (de) {
    const id = parseInt(de.dataset.del);
    deleteGame(id);
  }
});

// Anuncio
$('goAdBtn').addEventListener('click', () => {
  window.open(AD_URL, '_blank');
});
$('unlockBtn').addEventListener('click', () => {
  isUnlocked = true;
  $('lockModal').classList.add('hidden');
  if (pendingGame) doDownload(pendingGame);
  renderGames();
});

// Iniciar
loadGames();
</script>
</body>
</html>
