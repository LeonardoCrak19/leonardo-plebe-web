<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071119">
<title>Leonardo Plebe 🎮</title>
<style>
:root{--bg:#050a10;--panel:#0d1725;--green:#22c55e;--green2:#15803d;--red:#ff2d55;--text:#f8fafc;--muted:#9caabe;--line:#ffffff18}*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{min-height:100vh;color:var(--text);background:radial-gradient(circle at top,#12351f,#050a10 42%);overflow-x:hidden}.hidden{display:none!important}.home,.library{min-height:100vh}.home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:25px;text-align:center}.brand{font-size:clamp(2rem,8vw,3.5rem);font-weight:900;background:linear-gradient(90deg,#bbf7d0,#22c55e,#a3e635);-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{color:var(--muted);font-size:1rem}.search{width:min(560px,100%);padding:15px 18px;border:1px solid #60a5fa44;border-radius:15px;background:#0f172ad9;color:#fff;outline:0;font-size:1rem}.search:focus{border-color:var(--green);box-shadow:0 0 0 3px #22c55e22}.ad-slot{width:min(430px,100%);min-height:90px;border:1px solid var(--line);border-radius:16px;background:#02060c99;display:flex;align-items:center;justify-content:center;overflow:hidden}.primary{border:0;border-radius:14px;padding:15px 30px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 12px 28px #22c55e3d}.library{padding:24px 16px 90px}.top{max-width:780px;margin:auto;text-align:center}.title{margin-bottom:16px;color:#dcfce7;font-size:clamp(1.7rem,5vw,2.5rem)}.top .search{display:block;margin:0 auto 18px}.grid{max-width:780px;margin:25px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:linear-gradient(180deg,#0f1d2ff5,#080f18f5);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:20px;padding:18px 15px;text-align:center;box-shadow:0 18px 45px #0007}.cover{display:block;width:88px;height:88px;object-fit:cover;margin:0 auto 13px;border-radius:18px;background:#1f2937}.name{min-height:42px;display:flex;align-items:center;justify-content:center;font-weight:bold}.downloads{color:var(--muted);font-size:.85rem;margin:8px 0 15px}.download{width:100%;padding:12px;border:0;border-radius:11px;font-weight:bold;cursor:pointer}.locked{background:#293548;color:#dbe5f1}.unlocked{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff}.pagination{max-width:780px;margin:24px auto;display:flex;justify-content:center;align-items:center;gap:14px}.pager{padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:#fff;cursor:pointer}.pager:disabled{opacity:.35;cursor:not-allowed}.page{min-width:60px;text-align:center;font-weight:bold}.fab{position:fixed;right:22px;bottom:22px;width:62px;height:62px;border:0;border-radius:50%;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--red),#ff4d6d);color:#fff;font-size:2rem;font-weight:bold;cursor:pointer}.creator .fab{display:flex}.backdrop,.lock{position:fixed;inset:0;z-index:10;background:#000d;display:flex;align-items:center;justify-content:center;padding:18px}.modal,.lock-box{width:min(440px,100%);padding:25px 20px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}.modal h3,.lock h2{text-align:center;color:#dcfce7;margin-bottom:18px}.field{display:block;width:100%;padding:13px;margin-bottom:13px;border:1px solid var(--line);border-radius:11px;background:#111d2d;color:#fff}.actions{display:flex;gap:10px}.actions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.cancel{background:#374151;color:#fff}.save{background:var(--green);color:#fff}.lock{z-index:20;background:#010408f7;text-align:center}.lock p{color:var(--muted);line-height:1.5}.count{font-size:6rem;font-weight:900;color:var(--red);margin:20px}.unlock{display:none}.unlock.show{display:inline-block}.status{color:var(--muted);margin-top:15px;font-size:.9rem}@media(max-width:680px){.grid{grid-template-columns:1fr;max-width:430px}}
</style>
</head>
<body>
<main id="home" class="home">
<h1 class="brand">Leonardo Plebe 🎮</h1><p class="subtitle">Tus juegos favoritos en un solo lugar</p>
<input id="homeSearch" class="search" type="search" placeholder="Buscar juegos...">
<div class="ad-slot"><script async data-cfasync="false" src="https://pl31361168.profitableratecpmnetwork.com/f780a5aa4949d61cec3a7c2d2611e014/invoke.js"></script><div id="container-f780a5aa4949d61cec3a7c2d2611e014"></div></div>
<button id="enter" class="primary" type="button">🎮 Ver biblioteca</button>
</main>
<main id="library" class="library hidden"><section class="top"><h2 class="title">Biblioteca de juegos</h2><input id="librarySearch" class="search" type="search" placeholder="Buscar por nombre..."><div class="ad-slot"><span class="status">Publicidad</span></div></section><section id="grid" class="grid"></section><nav class="pagination"><button id="prev" class="pager" type="button">← Anterior</button><span id="page" class="page">1 / 1</span><button id="next" class="pager" type="button">Siguiente →</button></nav><button id="fab" class="fab" type="button">+</button></main>
<div id="addModal" class="backdrop hidden"><div class="modal"><h3>Publicar juego 🎮</h3><input id="name" class="field" placeholder="Nombre del juego"><input id="link" class="field" placeholder="Enlace https://..."><input id="image" class="field" type="file" accept="image/*"><div class="actions"><button id="cancel" class="cancel" type="button">Cancelar</button><button id="save" class="save" type="button">✅ Publicar</button></div></div></div>
<div id="lock" class="lock hidden"><div class="lock-box"><h2>Desbloquear descarga</h2><p>Abre el anuncio en otra pestaña y espera 7 segundos.</p><button id="adOpen" class="primary" type="button">🌐 Abrir anuncio</button><div id="count" class="count">—</div><button id="unlock" class="primary unlock" type="button">✅ Volver y descargar</button><div id="status" class="status">Pulsa “Abrir anuncio” para comenzar.</div></div></div>
<script>
'use strict';
const CREATOR_CODE='2k8L',PAGE_SIZE=6,STORAGE='leonardo_plebe_games_v4',AD_URL='https://www.profitableratecpmnetwork.com/zg26qqbwk3?key=9a7994b8893e7a6cc73b4cfdc2f064e9',FALLBACK='https://via.placeholder.com/88x88/20c55d/ffffff?text=🎮';
let games=[],currentPage=1,query='',creator=false,pending=null,unlocked=false,timer=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORAGE,JSON.stringify(games))}
function load(){try{games=JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(e){games=[]}if(!Array.isArray(games)||!games.length){games=[{id:Date.now(),name:'Minecraft',link:'https://www.mediafire.com/file/vmaz5vp7pf0fu34/minecraft-26-45-music.apk/file?dky=vo0ai7eoxz6&=583',image:'https://via.placeholder.com/88x88/20c55d/ffffff?text=MC',downloads:0}];save()}}
function list(){return games.filter(g=>String(g.name).toLowerCase().includes(query.toLowerCase()))}
function render(){const all=list(),pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));currentPage=Math.min(currentPage,pages);const part=all.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);$('grid').innerHTML='';part.forEach(g=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.className='cover';img.src=g.image||FALLBACK;img.alt=g.name;img.loading='lazy';const name=document.createElement('div');name.className='name';name.textContent=g.name;const d=document.createElement('div');d.className='downloads';d.textContent='⬇️ '+(g.downloads||0)+' descargas';const b=document.createElement('button');b.type='button';b.className='download '+(creator||unlocked?'unlocked':'locked');b.dataset.id=g.id;b.textContent=creator||unlocked?'✅ Descargar':'🔒 Ver anuncio';b.addEventListener('click',download);card.append(img,name,d,b);$('grid').appendChild(card)});$('page').textContent=currentPage+' / '+pages;$('prev').disabled=currentPage<=1;$('next').disabled=currentPage>=pages}
function showLibrary(){$('home').classList.add('hidden');$('library').classList.remove('hidden');render()}
function activateCreator(){creator=true;document.body.classList.add('creator');render()}
function download(e){const game=games.find(g=>g.id===Number(e.currentTarget.dataset.id));if(!game)return;if(creator||unlocked){openDownload(game);return}pending=game;openLock()}
function openDownload(game){const win=window.open(game.link,'_blank');if(!win){alert('Activa las ventanas emergentes para permitir la descarga.');return}game.downloads=(game.downloads||0)+1;save();render()}
function openLock(){if(timer)clearInterval(timer);unlocked=false;$('lock').classList.remove('hidden');$('count').textContent='—';$('unlock').classList.remove('show');$('status').textContent='Pulsa “Abrir anuncio” para comenzar.'}
$('enter').addEventListener('click',showLibrary);
$('homeSearch').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()===CREATOR_CODE){activateCreator();e.target.value=''}});
$('librarySearch').addEventListener('input',e=>{query=e.target.value;currentPage=1;render()});$('librarySearch').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()===CREATOR_CODE){activateCreator();e.target.value=''}});
$('prev').addEventListener('click',()=>{if(currentPage>1){currentPage--;render()}});$('next').addEventListener('click',()=>{if(currentPage<Math.ceil(list().length/PAGE_SIZE)){currentPage++;render()}});
$('adOpen').addEventListener('click',()=>{window.open(AD_URL,'_blank');if(timer)clearInterval(timer);let n=7;$('count').textContent=n;$('status').textContent='Anuncio abierto. Espera...';timer=setInterval(()=>{n--;$('count').textContent=n;if(n<=0){clearInterval(timer);timer=null;$('count').textContent='✅';$('unlock').classList.add('show');$('status').textContent='Ya puedes descargar.'}},1000)});
$('unlock').addEventListener('click',()=>{if(!pending)return;const game=pending;pending=null;$('lock').classList.add('hidden');unlocked=true;openDownload(game)});
$('fab').addEventListener('click',()=>$('addModal').classList.remove('hidden'));$('cancel').addEventListener('click',()=>{$('addModal').classList.add('hidden')});
$('save').addEventListener('click',()=>{const name=$('name').value.trim(),link=$('link').value.trim(),file=$('image').files[0];if(!name||!/^https?:\/\//i.test(link)){alert('Escribe un nombre y un enlace válido.');return}const finish=image=>{games.unshift({id:Date.now(),name,link,image,downloads:0});save();$('addModal').classList.add('hidden');$('name').value='';$('link').value='';$('image').value='';render()};if(!file){finish(FALLBACK);return}const reader=new FileReader();reader.onload=e=>finish(e.target.result);reader.readAsDataURL(file)});
load();render();
</script>
</body>
</html>
